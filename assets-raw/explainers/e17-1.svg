<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M340 30 L340 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · Like a broom on your hand</text><path d="M150 552 Q190 530 230 552 L236 580 L144 580 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M190 540 L230 190" fill="none" stroke="#16305c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M216 196 L250 170 L262 120 L230 150 L206 128 L212 182 Z" fill="url(#hatch)" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M262 210 Q290 240 296 280" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><text x="300" y="300" text-anchor="end" class="d-lbl">It starts</text><text x="300" y="316" text-anchor="end" class="d-txt">to tip</text><path d="M150 600 L250 600" fill="none" stroke="#e0a72e" stroke-width="2.5" marker-end="url(#arG)"/><text x="200" y="624" text-anchor="middle" class="d-lbl-gold">The hand moves under it</text><text x="364" y="44" class="d-head">B · Three ways to push the exhaust sideways</text><rect x="440" y="140" width="60" height="240" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M446 432 L494 432 L504 560 L476 560 Z" fill="rgba(224,167,46,0.35)" stroke="#e0a72e" stroke-width="1.5"/><path d="M456 380 L484 380 L496 430 L444 430 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M462 440 L468 470 M478 440 L484 470" fill="none" stroke="#16305c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="470" y="590" text-anchor="middle" class="d-lbl">Vanes in the exhaust</text><text x="470" y="606" text-anchor="middle" class="d-txt">Redstone</text><path d="M424 120 Q470 92 516 120" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><rect x="670" y="140" width="60" height="240" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M676 432 L724 432 L710 560 L690 560 Z" fill="rgba(224,167,46,0.35)" stroke="#e0a72e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M686 380 L714 380 L726 430 L674 430 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M670 350 L658 350" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M652 352 L664 352 L667 372 L649 372 Z" fill="#ffffff" stroke="#16305c" stroke-width="1.5" transform="rotate(-12 658 352)"/><path d="M650 374 L666 374 L660 420 L656 420 Z" fill="rgba(224,167,46,0.35)" stroke="#e0a72e" stroke-width="1" transform="rotate(-12 658 352)"/><path d="M730 350 L742 350" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M736 352 L748 352 L751 372 L733 372 Z" fill="#ffffff" stroke="#16305c" stroke-width="1.5" transform="rotate(-12 742 352)"/><path d="M734 374 L750 374 L744 420 L740 420 Z" fill="rgba(224,167,46,0.35)" stroke="#e0a72e" stroke-width="1" transform="rotate(-12 742 352)"/><text x="700" y="590" text-anchor="middle" class="d-lbl">Small swivelling engines</text><text x="700" y="606" text-anchor="middle" class="d-txt">the R-7’s verniers</text><path d="M654 120 Q700 92 746 120" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><rect x="900" y="140" width="60" height="240" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M906 432 L954 432 L940 560 L920 560 Z" fill="rgba(224,167,46,0.35)" stroke="#e0a72e" stroke-width="1.5" transform="rotate(-10 930 380)"/><path d="M916 380 L944 380 L956 430 L904 430 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" transform="rotate(-10 930 380)"/><circle cx="930" cy="380" r="4" fill="#16305c"/><text x="930" y="590" text-anchor="middle" class="d-lbl">Tilt the whole engine</text><text x="930" y="606" text-anchor="middle" class="d-txt">later rockets</text><path d="M884 120 Q930 92 976 120" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="700" y="84" text-anchor="middle" class="d-lbl-gold">Each one turns the rocket</text><text x="24" y="650" class="d-sm">Not to scale</text>
        </svg>
