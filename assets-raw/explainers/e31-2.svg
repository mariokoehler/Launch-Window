<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-lbl-red { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #c6402b; }
  .d-tag { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.3px; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchS" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#16305c" stroke-width="1.6"/></pattern></defs><path d="M530 30 L530 470" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5"/><text x="24" y="44" class="d-head">A · The American answer</text><text x="554" y="44" class="d-head">B · The Soviet answer</text><path d="M216 120 L284 120 L294 160 L370 340 Q250 372 130 340 L206 160 Z" fill="url(#hatchS)" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round"/><path d="M221 126 L279 126 L289 164 L363 334 Q250 364 137 334 L211 164 Z" fill="#ffffff" stroke="none"/><path d="M221 126 L279 126 L289 164 L363 334 Q250 364 137 334 L211 164 Z" fill="rgba(224,167,46,0.40)" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round"/><path d="M190 308 Q250 290 300 300" fill="none" stroke="#16305c" stroke-width="2.5" stroke-linecap="round"/><text x="250" y="236" text-anchor="middle" class="d-lbl">Pure oxygen,</text><text x="250" y="254" text-anchor="middle" class="d-lbl">0.34 atm</text><path d="M334 250 L400 250" fill="none" stroke="#16305c" stroke-width="1"/><text x="406" y="254" class="d-lbl">Thin wall</text><text x="250" y="400" text-anchor="middle" class="d-sm">Cone</text><rect x="40.0" y="418" width="143.6" height="28" fill="rgba(224,167,46,0.16)" stroke="#e0a72e" stroke-width="1.5"/><text x="51.0" y="437" class="d-tag" fill="#8a5d12" style="fill: #8a5d12">Lighter, simpler</text><rect x="40.0" y="452" width="158.8" height="28" fill="rgba(198,64,43,0.10)" stroke="#c6402b" stroke-width="1.5"/><text x="51.0" y="471" class="d-tag" fill="#c6402b" style="fill: #c6402b">Fire, prebreathing</text><circle cx="790" cy="236" r="120" fill="url(#hatchS)" stroke="#16305c" stroke-width="1.5"/><circle cx="790" cy="236" r="106" fill="#ffffff"/><circle cx="790" cy="236" r="106" fill="url(#hatch)" stroke="#16305c" stroke-width="1.5"/><path d="M730 306 Q790 288 840 298" fill="none" stroke="#16305c" stroke-width="2.5" stroke-linecap="round"/><text x="790" y="232" text-anchor="middle" class="d-lbl halo">Air,</text><text x="790" y="250" text-anchor="middle" class="d-lbl halo">1 atm</text><path d="M906 166 L944 140" fill="none" stroke="#16305c" stroke-width="1"/><text x="948" y="138" class="d-lbl">Thicker</text><text x="948" y="155" class="d-lbl">wall</text><text x="790" y="400" text-anchor="middle" class="d-sm">Sphere</text><rect x="560.0" y="418" width="227.2" height="28" fill="rgba(224,167,46,0.16)" stroke="#e0a72e" stroke-width="1.5"/><text x="571.0" y="437" class="d-tag" fill="#8a5d12" style="fill: #8a5d12">No fire worry, ordinary air</text><rect x="560.0" y="452" width="364.0" height="28" fill="rgba(198,64,43,0.10)" stroke="#c6402b" stroke-width="1.5"/><text x="571.0" y="471" class="d-tag" fill="#c6402b" style="fill: #c6402b">Heavier hull, prebreathing before a spacewalk</text><path d="M50 548 L1020 548" fill="none" stroke="#16305c" stroke-width="2"/><circle cx="70.0" cy="548" r="7" fill="#c6402b" stroke="#ffffff" stroke-width="2"/><text x="70.0" y="514" class="d-lbl">1961</text><text x="70.0" y="531" class="d-txt">Bondarenko’s chamber fire</text><circle cx="332.9" cy="548" r="7" fill="#16305c" stroke="#ffffff" stroke-width="2"/><text x="332.85" y="578" text-anchor="middle" class="d-lbl">1965</text><text x="332.85" y="595" text-anchor="middle" class="d-txt">Leonov’s spacewalk</text><circle cx="464.3" cy="548" r="7" fill="#c6402b" stroke="#ffffff" stroke-width="2"/><text x="464.28" y="514" text-anchor="middle" class="d-lbl">1967</text><text x="464.28" y="531" text-anchor="middle" class="d-txt">Apollo 1</text><circle cx="990.0" cy="548" r="7" fill="#e0a72e" stroke="#ffffff" stroke-width="2"/><text x="1002.0" y="578" text-anchor="end" class="d-lbl">1975</text><text x="1002.0" y="595" text-anchor="end" class="d-txt">Apollo-Soyuz’s airlock</text><text x="24" y="640" class="d-sm">Not to scale</text>
</svg>
