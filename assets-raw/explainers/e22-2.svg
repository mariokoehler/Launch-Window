          <text x="24" y="44" class="d-head">Four steps, 1965 to 1969</text><circle cx="130.0" cy="170.0" r="20.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="130.0" cy="170.0" r="12.0" fill="rgba(22,48,92,0.08)" stroke="#16305c" stroke-width="1"/><rect x="102.0" y="194" width="56.0" height="92" rx="18.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="88.0" y="200" width="16.0" height="80" rx="8.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="108.0" y="288" width="20.0" height="96" rx="9.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="156.0" y="200" width="16.0" height="80" rx="8.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="132.0" y="288" width="20.0" height="96" rx="9.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="130" y="116" text-anchor="middle" class="d-lbl">Gemini 4</text><text x="130" y="132" text-anchor="middle" class="d-sm">June 1965</text><text x="130" y="430" text-anchor="middle" class="d-txt">White: a hand-held gas gun</text><text x="130" y="446" text-anchor="middle" class="d-txt">and a hose to the capsule</text><path d="M170 210 Q220 170 240 120" fill="none" stroke="#16305c" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="390.0" cy="170.0" r="20.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="390.0" cy="170.0" r="12.0" fill="rgba(22,48,92,0.08)" stroke="#16305c" stroke-width="1"/><rect x="362.0" y="194" width="56.0" height="92" rx="18.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="348.0" y="200" width="16.0" height="80" rx="8.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="368.0" y="288" width="20.0" height="96" rx="9.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="416.0" y="200" width="16.0" height="80" rx="8.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="392.0" y="288" width="20.0" height="96" rx="9.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="390" y="116" text-anchor="middle" class="d-lbl">Gemini 9</text><text x="390" y="132" text-anchor="middle" class="d-sm">June 1966</text><text x="390" y="430" text-anchor="middle" class="d-txt">Cernan: nothing to hold on to;</text><text x="390" y="446" text-anchor="middle" class="d-txt">he overheated, his visor fogged</text><path d="M430 210 Q480 170 500 120" fill="none" stroke="#16305c" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="650.0" cy="170.0" r="20.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="650.0" cy="170.0" r="12.0" fill="rgba(22,48,92,0.08)" stroke="#16305c" stroke-width="1"/><rect x="622.0" y="194" width="56.0" height="92" rx="18.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="608.0" y="200" width="16.0" height="80" rx="8.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="628.0" y="288" width="20.0" height="96" rx="9.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="676.0" y="200" width="16.0" height="80" rx="8.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="652.0" y="288" width="20.0" height="96" rx="9.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="650" y="116" text-anchor="middle" class="d-lbl">Gemini 12</text><text x="650" y="132" text-anchor="middle" class="d-sm">November 1966</text><text x="650" y="430" text-anchor="middle" class="d-txt">Aldrin: handholds, foot</text><text x="650" y="446" text-anchor="middle" class="d-txt">restraints, rests; trained underwater</text><path d="M690 210 Q740 170 760 120" fill="none" stroke="#16305c" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="910.0" cy="170.0" r="20.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="910.0" cy="170.0" r="12.0" fill="rgba(22,48,92,0.08)" stroke="#16305c" stroke-width="1"/><rect x="882.0" y="194" width="56.0" height="92" rx="18.0" fill="#ffffff" stroke="#1