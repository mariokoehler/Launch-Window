rection</text><path d="M760 200 L900 200 Q950 200 960 214 Q950 228 900 228 L760 228 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M740 186 Q730 214 740 242" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M760 214 L1010 214" fill="none" stroke="#16305c" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arN)"/><text x="860" y="270" text-anchor="middle" class="d-lbl">A rifle bullet is spun</text><text x="860" y="286" text-anchor="middle" class="d-txt">so it flies straight</text><path d="M860 470 L820 410 Q860 380 900 410 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M860 380 L860 350" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M820 400 A40 10 0 1 0 900 400" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="860" y="510" text-anchor="middle" class="d-lbl">A spinning top</text><text x="860" y="526" text-anchor="middle" class="d-txt">stays upright</text><text x="24" y="650" class="d-sm">Not to scale · simplified</text>
