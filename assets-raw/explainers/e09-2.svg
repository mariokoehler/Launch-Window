          <text x="24" y="44" class="d-head">Mercury-Atlas 3, 25 April 1961, uncrewed</text><rect x="24" y="560" width="276" height="40" fill="url(#hatch)"/><path d="M24 560 L300 560" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M300 560 Q312 552 324 560 Q336 568 348 560 Q360 552 372 560 Q384 568 396 560 Q408 552 420 560 Q432 568 444 560 Q456 552 468 560 Q480 568 492 560 Q504 552 516 560 Q528 568 540 560 Q552 552 564 560 Q576 568 588 560 Q600 552 612 560 Q624 568 636 560 Q648 552 660 560 Q672 568 684 560 Q696 552 708 560 Q720 568 732 560 Q744 552 756 560 Q768 568 780 560 Q792 552 804 560 Q816 568 828 560 Q840 552 852 560 Q864 568 876 560 Q888 552 900 560 Q912 568 924 560 Q936 552 948 560 Q960 568 972 560 Q984 552 996 560 Q1008 568 1020 560" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="596" text-anchor="middle" class="d-sm">Atlantic Ocean</text><path d="M92 560 L108 560 L104 548 L96 548 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M100 556 C110 420 150 330 220 270" fill="none" stroke="#16305c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M220 270 Q216 400 200 556" fill="none" stroke="#16305c" stroke-width="1.5" stroke-dasharray="5 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M229.0 270.0 L240.0 270.0" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M226.4 276.4 L234.1 284.1" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M220.0 279.0 L220.0 290.0" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M213.6 276.4 L205.9 284.1" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M211.0 270.0 L200.0 270.0" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M213.6 263.6 L205.9 255.9" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M220.0 261.0 L220.0 250.0" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M226.4 263.6 L234.1 255.9" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M222 262 Q300 120 430 140 Q580 170 700 548" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M520 196 Q531 180 542 196 M520 196 L531 204 M542 196 L531 204" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M600 334 Q625 302 650 334 M600 334 L625 352 M650 334 L625 352 M625 334 L625 352" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="531" cy="206" r="4" fill="#16305c"/><circle cx="625" cy="354" r="5" fill="#16305c"/><circle cx="130" cy="500" r="13" fill="#16305c"/><text x="130" y="505" text-anchor="middle" style="font-family: Archivo; font-weight: 700; font-size: 14px; fill: #f5efe1;">1</text><text x="150" y="505" class="d-lbl">Liftoff</text><circle cx="236" cy="242" r="13" fill="#16305c"/><text x="236" y="247" text-anchor="middle" style="font-family: Archivo; font-weight: 700; font-size: 14px; fill: #f5efe1;">2</text><text x="244" y="300" class="d-lbl">About 40 s: off course,</text><text x="244" y="316" class="d-txt">the rocket is destroyed</text><circle cx="200" cy="170" r="13" fill="#e0a72e"/><text x="200" y="175" text-anchor="middle" style="font-family: Archivo; font-weight: 700; font-size: 14px; fill: #16305c;">3</text><text x="184" y="166" text-anchor="end" class="d-lbl-gold">Escape rocket fires,</text><text x="184" y="182" text-anchor="end" class="d-txt">capsule pulled clear</text><circle cx="575" cy="186" r="13" fill="#16305c"/><text x="575" y="191" text-anchor="middle" style="font-family: Archivo; font-weight: 700; font-size: 14px; fill: #f5efe1;">4</text><text x="595" y="191" class="d-lbl">Drogue chute opens</text><circle cx="668" cy="330" r="13" fill="#16305c"/><text x="668" y="335" text-anchor="middle" style="font-family: Archivo; font-weight: 700; font-size: 14px; fill: #f5efe1;">5</text><text x="688" y="335" class="d-lbl">Main chute</text><circle cx="740" cy="520" r="13" fill="#16305c"/><text x="740" y="525" text-anchor="middle" style="font-family: Archivo; font-weight: 700; font-size: 14px; fill: #f5efe1;">6</text><text x="760" y="518" class="d-lbl">Splashdown: picked up,</text><text x="760" y="534" class="d-txt">and flown again on MA-4</text><text x="760" y="84" class="d-sm">On a normal Atlas flight</text><rect x="760" y="96" width="180" height="14" fill="#e0a72e"/><rect x="940" y="96" width="80" height="14" fill="#ffffff" stroke="#16305c" stroke-width="1"/><text x="760" y="128" class="d-sm">0 s</text><text x="940" y="128" text-anchor="middle" class="d-sm">about 2.5 min</text><text x="760" y="146" class="d-lbl-gold">Tower carried</text><text x="950" y="146" class="d-lbl">Tower gone</text><text x="24" y="640" class="d-sm">Path sketched, not to scale · numbers follow the order of events</text>
        </svg>
