          <text x="24" y="44" class="d-head">A · Two ways to power a satellite</text><rect x="60" y="90" width="90" height="44" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="150" y="104" width="7" height="16" fill="#16305c"/><rect x="65" y="95" width="80.0" height="34" fill="#16305c"/><text x="105" y="154" text-anchor="middle" class="d-sm">Launch</text><rect x="190" y="90" width="90" height="44" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="280" y="104" width="7" height="16" fill="#16305c"/><rect x="195" y="95" width="40.0" height="34" fill="#16305c"/><text x="235" y="154" text-anchor="middle" class="d-sm">After 1 week</text><rect x="320" y="90" width="90" height="44" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="410" y="104" width="7" height="16" fill="#16305c"/><text x="365" y="154" text-anchor="middle" class="d-sm">After 3 weeks</text><text x="60" y="186" class="d-lbl">Batteries run down, then the radio falls silent</text><rect x="620" y="86" width="250" height="80" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M670 86 L670 166" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M720 86 L720 166" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M770 86 L770 166" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M820 86 L820 166" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M620 126 L870 126" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="980" cy="110" r="22" fill="#e0a72e"/><path d="M1008.0 110.0 L1018.0 110.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M999.8 129.8 L1006.9 136.9" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M980.0 138.0 L980.0 148.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M960.2 129.8 L953.1 136.9" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M952.0 110.0 L942.0 110.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M960.2 90.2 L953.1 83.1" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M980.0 82.0 L980.0 72.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M999.8 90.2 L1006.9 83.1" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M950 126 L884 130" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="620" y="186" class="d-lbl-gold">Solar cells make power whenever the Sun shines</text><text x="24" y="252" class="d-head">B · How long their radios lasted</text><text x="220" y="298" text-anchor="end" class="d-lbl">Sputnik 1</text><rect x="231.1" y="284" width="6.6" height="20" fill="#16305c"/><text x="247.7" y="298" class="d-txt">about 3 weeks</text><text x="220" y="348" text-anchor="end" class="d-lbl">Explorer 1</text><rect x="266.9" y="334" width="33.6" height="20" fill="#16305c"/><text x="310.4" y="348" class="d-txt">about 4 months</text><text x="220" y="398" text-anchor="end" class="d-lbl">Vanguard 1, battery radio</text><rect x="280.6" y="384" width="28.6" height="20" fill="#16305c"/><text x="319.2" y="398" class="d-txt">about 3 months</text><text x="220" y="448" text-anchor="end" class="d-lbl">Vanguard 1, solar radio</text><rect x="280.6" y="434" width="680.9" height="20" fill="#e0a72e"/><text x="294.6" y="448" class="d-lbl" style="fill: #16305c;">solar powered: about six years</text><path d="M230.0 500 L1000.0 500" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="r