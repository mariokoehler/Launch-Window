          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <text x="24" y="44" class="d-head">Luna 3's photo lab, October 1959</text><rect x="40.0" y="160.0" width="150.0" height="100.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="115" y="286" text-anchor="middle" class="d-lbl">1 · Camera</text><text x="115" y="304" text-anchor="middle" class="d-txt">two lenses, onto film</text><path d="M194 210 L226 210" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><rect x="230.0" y="160.0" width="150.0" height="100.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="305" y="286" text-anchor="middle" class="d-lbl">2 · Develop</text><text x="305" y="304" text-anchor="middle" class="d-txt">chemicals, on board</text><path d="M384 210 L416 210" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><rect x="420.0" y="160.0" width="150.0" height="100.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="495" y="286" text-anchor="middle" class="d-lbl">3 · Fix and dry</text><path d="M574 210 L606 210" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><rect x="610.0" y="160.0" width="150.0" height="100.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="685" y="286" text-anchor="middle" class="d-lbl">4 · Scan</text><text x="685" y="304" text-anchor="middle" class="d-txt">a spot of light, line by line</text><path d="M764 210 L796 210" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><rect x="800.0" y="160.0" width="150.0" height="100.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="875" y="286" text-anchor="middle" class="d-lbl">5 · Radio home</text><text x="875" y="304" text-anchor="middle" class="d-txt">brightness as a signal</text><circle cx="95.0" cy="210.0" r="18.0" fill="none" stroke="#16305c" stroke-width="2"/><circle cx="95.0" cy="210.0" r="8.0" fill="rgba(22,48,92,0.12)" stroke="#16305c" stroke-width="1.5"/><circle cx="140.0" cy="210.0" r="12.0" fill="none" stroke="#16305c" stroke-width="2"/><ci