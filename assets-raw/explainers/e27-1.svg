necap="round"/><path d="M60 396 L420 396" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 402 L420 402" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 408 L420 408" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 414 L420 414" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 420 L420 420" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 426 L420 426" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 432 L420 432" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 438 L420 438" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 444 L420 444" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 450 L420 450" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 456 L420 456" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 462 L420 462" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 468 L420 468" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 474 L420 474" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 480 L420 480" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 486 L420 486" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 492 L420 492" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 498 L420 498" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 504 L420 504" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 510 L420 510" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/></g><path d="M60 514 L420 514" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="240" y="544" text-anchor="middle" class="d-txt">still arriving</text><text x="460" y="430" class="d-body">The far side of the Moon, never seen before:</text><text x="460" y="452" class="d-body">blurry and grey, but the first look at the</text><text x="460" y="474" class="d-body">half that always faces away from Earth.</text><text x="460" y="520" class="d-body">Lunar Orbiter used the same idea in 1966 and</text><text x="460" y="542" class="d-body">1967, with far finer film, to map Apollo's landing sites.</text><text x="24" y="640" class="d-sm">Not to scale</text>
        
</svg>
