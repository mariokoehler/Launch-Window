<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M530 30 L530 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · A pointed nose</text><path d="M36 250 L96 250" fill="none" stroke="#16305c" stroke-width="1.5" marker-end="url(#arN)"/><path d="M36 300 L96 300" fill="none" stroke="#16305c" stroke-width="1.5" marker-end="url(#arN)"/><path d="M36 350 L96 350" fill="none" stroke="#16305c" stroke-width="1.5" marker-end="url(#arN)"/><text x="36" y="226" class="d-sm">Air rushing past</text><path d="M170 300 L380 232 L440 232 L440 368 L380 368 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M170 300 L420 160 M170 300 L420 440" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M170 300 L232 280 L232 320 Z" fill="url(#hatchG)" stroke="#e0a72e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M112 284 L162 296" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M112 316 L162 304" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="430" y="150" text-anchor="end" class="d-lbl-gold">Shock wave</text><text x="170" y="480" class="d-txt">The shock touches the tip, and the hot air</text><text x="170" y="496" class="d-txt">hugs the surface: the heat soaks</text><text x="170" y="512" class="d-txt">straight into the nose.</text><text x="554" y="44" class="d-head">B · A blunt face</text><path d="M548 250 L594 250" fill="none" stroke="#16305c" stroke-width="1.5" marker-end="url(#arN)"/><path d="M548 300 L594 300" fill="none" stroke="#16305c" stroke-width="1.5" marker-end="url(#arN)"/><path d="M548 350 L594 350" fill="none" stroke="#16305c" stroke-width="1.5" marker-end="url(#arN)"/><path d="M650 140 Q590 300 650 460 L700 380 Q672 300 700 220 Z" fill="url(#hatchG)" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><path d="M650 140 Q590 300 650 460" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M700 220 Q672 300 700 380 L880 340 L880 260 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M690 196 Q770 150 900 166" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M690 404 Q770 450 900 434" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="730" y="130" class="d-lbl-gold">Most of the heat stays in the air</text><text x="730" y="146" class="d-txt">and streams away past the capsule</text><text x="660" y="500" class="d-txt">The shock stands off ahead: a cushion of</text><text x="660" y="516" class="d-txt">glowing air takes most of the heat, and</text><text x="660" y="532" class="d-txt">only a little reaches the capsule.</text><text x="24" y="640" class="d-sm">Not to scale · from orbit, the air meets the capsule at about 7.8 km/s</text>
        </svg>
