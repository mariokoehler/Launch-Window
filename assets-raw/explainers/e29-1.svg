          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <text x="24" y="44" class="d-head">An X-15 flight, about ten minutes from drop to landing</text><path d="M110 590.0 L1040 590.0" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M104 590 L110 590" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="594" text-anchor="end" class="d-sm">0 km</text><path d="M104 498 L110 498" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="502" text-anchor="end" class="d-sm">20 km</text><path d="M104 406 L110 406" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="410" text-anchor="end" class="d-sm">40 km</text><path d="M104 314 L110 314" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="318" text-anchor="end" class="d-sm">60 km</text><path d="M104 222 L110 222" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="226" text-anchor="end" class="d-sm">80 km</text><path d="M104 130 L110 130" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="134" text-anchor="end" class="d-sm">100 km</text><path d="M110 590 L110 84" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 219.7 L1040 219.7" fill="none" stroke="#e0a72e" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/><text x="1036" y="211.7" text-anchor="end" class="d-lbl-gold">50 miles: astronaut wings for US pilots</text><path d="M110 130 L1040 130" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="2 5" stroke-linejoin="round" stroke-linecap="round"/><text x="1036" y="124" text-anchor="end" class="d-sm">100 km</text><rect x="110" y="452" width="930" height="138" fill="rgba(22,48,92,0.05)"/><text x="1036" y="468" text-anchor="end" class="d-sm">Air thick enough for fins and flaps</text><path d="M180 525.6 L260 507.2 C 330 406.0, 400 130.0, 480 93.2 C 560 93.2, 620 314.0, 700 452.0 C 800 544.0, 920 580.8, 1000 590.0" fill="none" stroke="#e0a72e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M120 509.6 L240 509.6" fill="none" stroke="#16305c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 509.6 L190 519.6 M200 509.6 L160 519.6" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="130" y="491.6" class="d-lbl">Dropped from a B-52</text><g transform="rotate(-62 330 360.0)"><path d="M294.0 356.4 L354.0 356.4 L368.4 360.0 L354.0 363.6 L294.0 363.6 Z M324.0 362.4 L312.0 373.2 L302.4 373.2 L306.0 362.4 M300.0 356.4 L292.8 344.4 L297.6 344.4 L306.0 356.4" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round"/></g><text x="350" y="364" class="d-lbl">Rocket burns about 80 s</text><g transform="rotate(0 480 93.20000000000005)"><path d="M444.0 89.60000000000005 L504.0 89.60000000000005 L518.4 93.20000000000005 L504.0 96.80000000000004 L444.0 96.80000000000004 Z M474.0 95.60000000000005 L462.0 106.40000000000005 L452.4 106.40000000000005 L456.0 95.60000000000005 M450.0 89.60000000000005 L442.8 77.60000000000005 L447.6 77.60000000000005 L456.0 89.60000000000005" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round"/></g><text x="480" y="75.2" text-anchor="middle" class="d-lbl-gold">About 108 km</text><text x="560" y="148.4" class="d-txt halo">Above the air: small jets in the</text><text x="560" y="164.4" class="d-txt halo">nose and wings turn it</text><g transform="rotate(0 1000 582.0)"><path d="M964.0 578.4 L1024.0 578.4 L1038.4 582.0 L1024.0 585.6 L964.0 585.6 Z M994.0 584.4 L982.0 595.2 L972.4 595.2 L976.0 584.4 M970.0 578.4 L962.8 566.4 L967.6 566.4 L976.0 578.4" fill="#ffffff