          <text x="24" y="44" class="d-head">How long a satellite stays up, by height</text><path d="M140 120 L140 560 L1000 560" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M140.0 560 L140.0 566" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="582" text-anchor="middle" class="d-sm">1 day</text><path d="M140.0 120 L140.0 560" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="2 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M270.7 560 L270.7 566" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="270.663" y="582" text-anchor="middle" class="d-sm">1 week</text><path d="M270.7 120 L270.7 560" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="2 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M368.4 560 L368.4 566" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="368.381" y="582" text-anchor="middle" class="d-sm">1 month</text><path d="M368.4 120 L368.4 560" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="2 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M536.2 560 L536.2 566" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="536.163" y="582" text-anchor="middle" class="d-sm">1 year</text><path d="M536.2 120 L536.2 560" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="2 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M690.8 560 L690.8 566" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="690.775" y="582" text-anchor="middle" class="d-sm">10 years</text><path d="M690.8 120 L690.8 560" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="2 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M845.4 560 L845.4 566" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="845.388" y="582" text-anchor="middle" class="d-sm">100 years</text><path d="M845.4 120 L845.4 560" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="2 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M1000.0 560 L1000.0 566" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="1000" y="582" text-anchor="middle" class="d-sm">1,000 years</text><path d="M1000.0 120 L1000.0 560" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="2 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M134 535.3 L140 535.3" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="128" y="539.294" text-anchor="end" class="d-sm">200 km</text><path d="M134 436.5 L140 436.5" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="128" y="440.471" text-anchor="end" class="d-sm">400 km</text><path d="M134 337.6 L140 337.6" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="128" y="341.647" text-anchor="end" class="d-sm">600 km</text><path d="M134 238.8 L140 238.8" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="128" y="242.824" text-anchor="end" class="d-sm">800 km</text><path d="M134 140.0 L140 140.0" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="128" y="144" text-anchor="end" class="d-sm">1000 km</text><path d="M270.7 535.3 L285.1 530.4 L299.5 525.4 L313.9 520.5 L328.4 515.5 L342.8 510.6 L357.2 505.6 L371.6 500.7 L386.1 495.8 L400.5 490.8 L414.9 485.9 L429.8 480.9 L444.7 476.0 L459.6 471.1 L474.4 466.1 L489.3 461.2 L504.2 456.2 L519.1 451.3 L53