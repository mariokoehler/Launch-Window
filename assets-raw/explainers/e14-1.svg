          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <text x="24" y="44" class="d-head">A · Earth turns east, and carries the launch pad with it</text><circle cx="330" cy="350" r="230" fill="rgba(22,48,92,0.07)" stroke="#16305c" stroke-width="2"/><path d="M330 90 L330 610" fill="none" stroke="#16305c" stroke-width="1" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M296 104 A34 9 0 1 0 364 104" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><text x="374" y="92" class="d-sm">Earth turns eastward</text><ellipse cx="330" cy="350.0" rx="230.0" ry="12" fill="none" stroke="#16305c" stroke-width="1.2"/><circle cx="330" cy="362.0" r="5" fill="#16305c"/><path d="M330 362.0 L492.8 362.0" fill="none" stroke="#e0a72e" stroke-width="3" marker-end="url(#arG)"/><path d="M502.8 362.0 L590 362.0" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/><text x="598" y="360" class="d-lbl">Equator</text><text x="598" y="376" class="d-lbl-gold">about 465 m/s</text><ellipse cx="330" cy="240.3" rx="202.1" ry="12" fill="none" stroke="#16305c" stroke-width="1.2"/><circle cx="330" cy="252.3" r="5" fill="#16305c"/><path d="M330 252.3 L473.5 252.3" fill="none" stroke="#e0a72e" stroke-width="3" marker-end="url(#arG)"/><path d="M483.5 252.3 L590 252.3" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/><text x="598" y="250.253" class="d-lbl">Cape Canaveral, 28.5° N</text><text x="598" y="266.253" class="d-lbl-gold">about 410 m/s</text><ellipse cx="330" cy="185.7" rx="160.9" ry="12" fill="none" stroke="#16305c" stroke-width="1.2"/><circle cx="330" cy="197.7" r="5" fill="#16305c"/><path d="M330 197.7 L442.0 197.7" fill="none" stroke="#e0a72e" stroke-width="3" marker-end="url(#arG)"/><path d="M452.0 197.7 L590 197.7" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/><text x="598" y="195.671" class="d-lbl">Baikonur, about 46° N</text><text x="598" y="211.671" class="d-lbl-gold">about 320 m/s</text><text x="598" y="470" class="d-sm">The push, against the 7.8 km/s an orbit needs</text><rect x="598" y="486" width="400" height="18" fill="#ffffff" stroke="#16305c" stroke-width="1.2"/><rect x="598" y="486" width="23.8" height="18" fill="#e0a72e"/><text x="1004" y="499" text-anchor="end" class="d-txt" style="fill: #5b5548;">Equator</text><rect x="598" y="520" width="400" height="18" fill="#ffffff" stroke="#16305c" stroke-width="1.2"/><rect x="598" y="520" width="21.0" height="18" fill="#e0a72e"/><text x="1004" y="533" text-anchor="end" class="d-txt" style="fill: #5b5548;">Cape Canaveral</text><rect x="598" y="554" width="400" height="18" fill="#ffffff" stroke="#16305c" stroke-width="1.2"/><rect x="598" y="554" width="16.4" height="18" fill="#e0a72e"/><text x="1004" y="567" text-anchor="end" class="d-txt" style="fill: #5b5548;">Baikonur</text><text x="24" y="640" class="d-sm">Not to scale · ground speeds and bars to scale with each other</text>
