<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M353 30 L353 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M706 30 L706 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · Test first</text><rect x="97.0" y="320" width="26" height="200" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M97.0 490 L85.0 520 L97.0 520 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M123.0 490 L135.0 520 L123.0 520 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M97.0 320 L103.5 290 L116.5 290 L123.0 320 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 290 L110 264" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="237.0" y="320" width="26" height="200" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M237.0 490 L225.0 520 L237.0 520 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M263.0 490 L275.0 520 L263.0 520 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M237.0 320 L243.5 290 L256.5 290 L263.0 320 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 290 L250 264" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="250" cy="308" r="4" fill="#e0a72e"/><path d="M98 248 L108 258 L124 236" fill="none" stroke="#e0a72e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M146 400 L216 400" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><text x="110" y="552" text-anchor="middle" class="d-lbl">Uncrewed test</text><text x="250" y="552" text-anchor="middle" class="d-lbl-gold">Then a crew</text><text x="181" y="590" text-anchor="middle" class="d-txt">Each test finds faults that can be</text><text x="181" y="606" text-anchor="middle" class="d-txt">fixed before anyone is on board.</text><text x="377" y="44" class="d-head">B · Two of everything vital</text><rect x="384" y="210" width="134" height="60" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="451" y="238" text-anchor="middle" class="d-lbl">Automatic</text><text x="451" y="256" text-anchor="middle" class="d-txt">aiming</text><rect x="548" y="210" width="134" height="60" fill="#ffffff" stroke="#e0a72e" stroke-width="2"/><text x="615" y="238" text-anchor="middle" class="d-lbl-gold">Manual</text><text x="615" y="256" text-anchor="middle" class="d-txt">backup</text><path d="M432 222 L470 258 M470 222 L432 258" fill="none" stroke="#16305c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M451 270 L451 330 L530 330 L530 400" fill="none" stroke="#16305c" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M615 270 L615 330 L530 330 L530 396" fill="none" stroke="#e0a72e" stroke-width="3" marker-end="url(#arG)"/><rect x="470" y="400" width="120" height="50" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="530" y="430" text-anchor="middle" class="d-lbl">Retrofire</text><text x="530" y="190" text-anchor="middle" class="d-txt">If one fails, the other still works</text><text x="530" y="488" text-anchor="middle" class="d-txt">The crew still comes home.</text><text x="730" y="44" class="d-head">C · People on the ground</text><rect x="740" y="250" width="130" height="90" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M752 310 L772 300 L792 306 L812 296 L832 302 L858 298" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="890" y="250" width="130" height="90" fill="#ffffff" stroke="#e0a72e" stroke-width="2.5"/><path d="M902 314 L922 310 L942 312 L956 272 L970 316 L1008 312" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M730 350 L1030 350 L1010 410 L750 410 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M955 262 L955 222" fill="none" stroke="#e0a72e" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="962" y="214" text-anchor="end" class="d-lbl-gold">Spot the fault</text><circle cx="880" cy="470" r="18" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M856 470 Q856 444 880 444 Q904 444 904 470" fill="none" stroke="#16305c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M850 520 Q880 494 910 520" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="880" y="556" text-anchor="middle" class="d-txt">Work out a fix and talk</text><text x="880" y="572" text-anchor="middle" class="d-txt">the crew through it.</text><text x="24" y="640" class="d-sm">Not to scale</text>
        </svg>
