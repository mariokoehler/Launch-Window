<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <text x="24" y="44" class="d-head">The free return: a figure of eight (seen from above)</text><circle cx="210.0" cy="340.0" r="60.0" fill="rgba(22,48,92,0.10)" stroke="#16305c" stroke-width="2"/><path d="M150 340 Q210 367.0 270 340" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="820.0" cy="340.0" r="34.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="809.8" cy="333.2" r="6.1" fill="none" stroke="#16305c" stroke-width="1"/><circle cx="828.5" cy="350.2" r="4.1" fill="none" stroke="#16305c" stroke-width="1"/><text x="210" y="428" text-anchor="middle" class="d-sm">Earth</text><text x="820" y="398" text-anchor="middle" class="d-sm halo">Moon</text><path d="M262 310 C 420 220, 640 460, 820 404 C 890 396, 904 290, 820 276" fill="none" stroke="#e0a72e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M820 276 C 640 220, 420 460, 260 374" fill="none" stroke="#e0a72e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M380 251 L410 268" fill="none" stroke="#e0a72e" stroke-width="3" marker-end="url(#arG)"/><path d="M410 412 L380 429" fill="none" stroke="#e0a72e" stroke-width="3" marker-end="url(#arG)"/><text x="300" y="220" text-anchor="middle" class="d-lbl">1 · One burn sends it out</text><text x="916" y="320" class="d-lbl">2 · The Moon's</text><text x="916" y="336" class="d-lbl">gravity swings</text><text x="916" y="352" class="d-lbl">it round</text><text x="300" y="470" text-anchor="middle" class="d-lbl">3 · It falls back to Earth: no more burns</text><text x="515" y="300" text-anchor="middle" class="d-txt">The paths cross</text><text x="24" y="640" class="d-sm">Not to scale · the Moon is about 30 Earth widths away</text>
        
</svg>
