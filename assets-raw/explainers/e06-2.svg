<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M530 30 L530 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · On the ground</text><circle cx="200" cy="140" r="20" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="170" y="166" width="60" height="118" rx="14" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M172 180 L146 266" fill="none" stroke="#16305c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M228 180 L254 266" fill="none" stroke="#16305c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="178.0" y="286" width="20" height="150" rx="7" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="202.0" y="286" width="20" height="150" rx="7" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M100 456 L300 456" fill="none" stroke="#16305c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 456 L100 470" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M130 456 L120 470" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 456 L140 470" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M170 456 L160 470" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M190 456 L180 470" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M210 456 L200 470" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M230 456 L220 470" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 456 L240 470" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M270 456 L260 470" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M290 456 L280 470" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M190 330 L190 390" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><path d="M210 330 L210 390" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><text x="276" y="140" class="d-lbl">Balance organs</text><text x="276" y="156" class="d-txt">in the inner ear feel “down”</text><text x="276" y="330" class="d-lbl">Gravity pulls fluids</text><text x="276" y="346" class="d-txt">down toward the legs</text><text x="276" y="430" class="d-lbl">Feet press on the floor,</text><text x="276" y="446" class="d-txt">muscles and bones carry weight</text><text x="554" y="44" class="d-head">B · In orbit</text><circle cx="700" cy="150" r="25" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="670" y="181" width="60" height="118" rx="14" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M672 195 L636 167" fill="none" stroke="#16305c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M728 195 L764 167" fill="none" stroke="#16305c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="684.0" y="301" width="14" height="150" rx="7" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="702.0" y="301" width="14" height="150" rx="7" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M689 430 L689 350" fill="none" stroke="#e0a72e" stroke-width="2.5" marker-end="url(#arG)"/><path d="M711 430 L711 350" fill="none" stroke="#e0a72e" stroke-width="2.5" marker-end="url(#arG)"/><path d="M700 270 L700 205" fill="none" stroke="#e0a72e" stroke-width="2.5" marker-end="url(#arG)"/><path d="M724 140 L800 126" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="806" y="124" class="d-lbl">Balance organs</text><text x="806" y="140" class="d-txt">no “down” to feel: space sickness</text><path d="M722 230 L800 226" fill="none" stroke="#e0a72e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="806" y="224" class="d-lbl-gold">Fluids shift to the head</text><text x="806" y="240" class="d-txt">about 2 litres: puffy face, thin legs</text><path d="M732 320 L800 326" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="806" y="324" class="d-lbl">Muscles</text><text x="806" y="340" class="d-txt">little work to do, so they waste</text><path d="M716 420 L800 426" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="806" y="424" class="d-lbl">Bones</text><text x="806" y="440" class="d-txt">lose minerals without weight on them</text><text x="24" y="640" class="d-sm">Simplified figures · the effects grow with the length of the flight</text>
        </svg>
