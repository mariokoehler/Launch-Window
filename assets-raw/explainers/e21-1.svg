          <text x="24" y="44" class="d-head">A · The last hundred metres</text><rect x="830.0" y="144.0" width="170.0" height="52.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M830 144 L800 130 L800 210 L830 196" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M800 130 L826 170 L800 210" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="930" y="226" text-anchor="middle" class="d-lbl">Target</text><path d="M110 140 L110 200 L180 184 L180 156 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M180 170 L206 170" fill="none" stroke="#16305c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="208.0" cy="170.0" r="4.0" fill="#16305c" stroke="#16305c" stroke-width="1"/><text x="144" y="226" text-anchor="middle" class="d-lbl">Station-keeping</text><path d="M410 140 L410 200 L480 184 L480 156 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M480 170 L506 170" fill="none" stroke="#16305c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="508.0" cy="170.0" r="4.0" fill="#16305c" stroke="#16305c" stroke-width="1"/><text x="444" y="226" text-anchor="middle" class="d-lbl">Closing in</text><path d="M250 126 L420 126" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M550 126 L760 126" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="335" y="114" text-anchor="middle" class="d-txt">Match speed, wait</text><text x="655" y="114" text-anchor="middle" class="d-txt">Creep in, slower than walking pace</text><path d="M110 260 L1000 260" fill="none" stroke="#16305c" stroke-width="1" stroke-dasharray="2 6" stroke-linejoin="round" stroke-linecap="round"/><text x="555" y="278" text-anchor="middle" class="d-txt">Along the line of sight, small puffs of the thrusters</text><text x="24" y="334" class="d-head">B · Probe and drogue</text><path d="M190 420 L230 400 L230 540 L190 520 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M230 400 L194 470 L230 540" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M230 400 L300 400 M230 540 L300 540" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M16.0 410 L96.0 430 L96.0 510 L16.0 530" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M96.0 470 L248 494" fill="none" stroke="#16305c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="250.0" cy="494.0" r="4.0" fill="#16305c" stroke="#16305c" stroke-width="1"/><text x="180" y="574" text-anchor="middle" class="d-lbl">1 · The probe meets the cone</text><path d="M520 420 L560 400 L560 540 L520 520 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M560 400 L524 470 L560 540" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M560 400 L630 400 M560 540 L630 540" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M361.2 410 L441.2 430 L441.2 510 L361.2 530" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M441.2 470 L540 470" fill="none" stroke="#16305c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="542.0" cy="470.0" r="4.0" fill="#16305c" stroke="#16305c" stroke-width="1"/><text x="510" y="574" text-anchor="middle" class="d-lbl">2 · It slides to the tip</text><path d="M850 420 L890 400 L890 540 L850 520 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M890 400 L854 470 