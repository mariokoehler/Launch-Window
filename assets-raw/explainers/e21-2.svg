          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <text x="24" y="44" class="d-head">A · Transposition: turning around</text><rect x="190.0" y="140.0" width="150.0" height="60.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M190 140 L156 148 L156 192 L190 200" fill="#ffffff" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M156 148 L120 108 M156 192 L120 232" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="164.0" y="154.0" width="24.0" height="32.0" fill="url(#hatchG)" stroke="#e0a72e" stroke-width="1.5"/><path d="M116 156 L90 156 L70 164 L70 176 L90 184 L116 184 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M116 166 L126 160 L126 180 L116 174 Z" fill="#ffffff" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M66 144 L30 144" fill="none" stroke="#16305c" stroke-width="1.5" marker-end="url(#arN)"/><text x="200" y="242" text-anchor="middle" class="d-lbl">1 · Separate</text><rect x="530.0" y="140.0" width="150.0" height="60.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M530 140 L496 148 L496 192 L530 200" fill="#ffffff" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M496 148 L460 108 M496 192 L460 232" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="504.0" y="154.0" width="24.0" height="32.0" fill="url(#hatchG)" stroke="#e0a72e" stroke-width="1.5"/><path d="M418 176 L418 150 L426 130 L438 130 L446 150 L446 176 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M428 176 L422 186 L442 186 L436 176 Z" fill="#ffffff" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M396 150 A36 36 0 0 1 468 150" fill="none" stroke="#16305c" stroke-width="1.5" marker-end="url(#arN)"/><text x="540" y="242" text-anchor="middle" class="d-lbl">2 · Turn around</text><rect x="870.0" y="140.0" width="150.0" height="60.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M870 140 L836 148 L836 192 L870 200" fill="#ffffff" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="790.0" y="154.0" width="24.0" height="32.0" fill="url(#hatchG)" stroke="#e0a72e" stroke-width="1.5"/><path d="M790 164 L770 156 L744 156 L744 184 L770 184 L790 176 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M744 166 L734 160 L734 180 L744 174 Z" fill="#ffffff" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M770 140 L730 140" fill="none" stroke="#16305c" stroke-width="1.5" marker-end="url(#arN)"/><text x="880" y="242" text-anchor="middle" class="d-lbl">3 · Dock, pull the lander out</text><text x="265" y="126" text-anchor="middle" class="d-txt">S-IVB stage</text><text x="176" y="214" text-anchor="middle" class="d-lbl-gold">Lander</text><path d="M530 300 L530 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="334" class="d-head">B · Moving across: a tunnel</text><path d="M60 430 L140 430 L190 456 L190 484 L140 510 L60 510 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="190.0" y="456.0" width="40.0" height="28.0" fill="rgba(22,48,92,0.10)" stroke="#16305c" stroke-width="2"/><rect x="230.0" y="424.0" width="90.0" height="92.0" fill="url(#hatchG)" stroke="#e0a72e" stroke-width="1.5"/><circle cx="210" cy="470" r="6" fill="#e0a72e"/><path d="M150 470 L198 470" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="100" y="416" text-anchor="middle" class="d-txt">Command ship</text><text x="275" y="416" text-anchor="middle" class="d-lbl-gold">Lander</text><text x="210" y="540" text-anchor="middle" class="d-lbl">Probe and drogue taken out:</text><text x="210" y="556" text-anchor="middle" class="d-txt">the crew floats through inside</text><text x="554" y="334" class="d-head">C · …or outside, by spacewalk</text><path d="M620 440 L740 440 L770 470 L740 500 L620 500 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M980 440 L860 440 L830 470 L860 500 L980 500 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M770 470 L830 470" fill="none" stroke="#16305c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M700 434 Q800 360 900 434" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-dasharray="3 6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="800.0" cy="384.0" r="9.0" fill="#ffffff" stroke="#e0a72e" stroke-width="2"/><path d="M800 393 L800 414 M792 400 L808 400" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="680" y="526" text-anchor="middle" class="d-lbl">Soyuz 4</text><text x="920" y="526" text-anchor="middle" class="d-lbl">Soyuz 5</text><text x="800" y="556" text-anchor="middle" class="d-txt">No tunnel: two cosmonauts climbed across</text><text x="24" y="640" class="d-sm">Not to scale</text>
        
