<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <text x="24" y="44" class="d-head">Mercury-Atlas, the flights before John Glenn</text><rect x="30" y="110" width="140" height="170" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="100" y="140" text-anchor="middle" class="d-lbl">MA-1</text><text x="100" y="158" text-anchor="middle" class="d-sm">July 1960</text><path d="M84 184 L116 216 M116 184 L84 216" fill="none" stroke="#16305c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="100" y="246" text-anchor="middle" class="d-txt">Broke up about</text><text x="100" y="262" text-anchor="middle" class="d-txt">a minute in</text><rect x="198" y="110" width="140" height="170" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="268" y="140" text-anchor="middle" class="d-lbl">MA-2</text><text x="268" y="158" text-anchor="middle" class="d-sm">Feb 1961</text><path d="M250 202 L264 216 L288 186" fill="none" stroke="#16305c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="268" y="246" text-anchor="middle" class="d-txt">Up and down,</text><text x="268" y="262" text-anchor="middle" class="d-txt">re-entry tested</text><rect x="366" y="110" width="140" height="170" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="436" y="140" text-anchor="middle" class="d-lbl">MA-3</text><text x="436" y="158" text-anchor="middle" class="d-sm">April 1961</text><path d="M420 184 L452 216 M452 184 L420 216" fill="none" stroke="#16305c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="436" y="246" text-anchor="middle" class="d-txt">Off course,</text><text x="436" y="262" text-anchor="middle" class="d-txt">capsule saved</text><rect x="534" y="110" width="140" height="170" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="604" y="140" text-anchor="middle" class="d-lbl">MA-4</text><text x="604" y="158" text-anchor="middle" class="d-sm">Sept 1961</text><path d="M586 202 L600 216 L624 186" fill="none" stroke="#16305c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="604" y="246" text-anchor="middle" class="d-txt">One orbit,</text><text x="604" y="262" text-anchor="middle" class="d-txt">no crew</text><rect x="702" y="110" width="140" height="170" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="772" y="140" text-anchor="middle" class="d-lbl">MA-5</text><text x="772" y="158" text-anchor="middle" class="d-sm">Nov 1961</text><path d="M754 202 L768 216 L792 186" fill="none" stroke="#16305c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="772" y="246" text-anchor="middle" class="d-txt">Two orbits</text><text x="772" y="262" text-anchor="middle" class="d-txt">with Enos</text><rect x="870" y="110" width="140" height="170" fill="#ffffff" stroke="#e0a72e" stroke-width="3"/><text x="940" y="140" text-anchor="middle" class="d-lbl-gold">MA-6</text><text x="940" y="158" text-anchor="middle" class="d-sm">Feb 1962</text><path d="M922 202 L936 216 L960 186" fill="none" stroke="#e0a72e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="940" y="246" text-anchor="middle" class="d-txt">John Glenn,</text><text x="940" y="262" text-anchor="middle" class="d-txt">three orbits</text><path d="M871 92 L871 300" fill="none" stroke="#e0a72e" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/><text x="864" y="96" text-anchor="end" class="d-lbl-gold">Trusted with a crew</text><text x="24" y="360" class="d-head halo">What the failures taught</text><path d="M100 290 L100 386" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M436 290 L436 386" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="100" y="404" class="d-txt">The top of the rocket flexed:</text><text x="100" y="420" class="d-txt">a steel band was added to stiffen it.</text><text x="436" y="404" class="d-txt">A guidance fault was found</text><text x="436" y="420" class="d-txt">and fixed before the next try.</text><path d="M772 290 L772 386" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="772" y="404" class="d-txt">Enos’s flight was cut short</text><text x="772" y="420" class="d-txt">by a capsule fault: fixed too.</text><rect x="100" y="500" width="840" height="60" fill="none" stroke="#16305c" stroke-width="1.5"/><text x="520" y="526" text-anchor="middle" class="d-body">Five flights without a crew, two of them failures,</text><text x="520" y="546" text-anchor="middle" class="d-body">before a person rode the rocket.</text><text x="24" y="640" class="d-sm">Record simplified to the flights that carried a Mercury capsule</text>
        </svg>
