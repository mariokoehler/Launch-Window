<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M500 30 L500 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · Seen from the planet</text><circle cx="290.0" cy="330.0" r="56.0" fill="rgba(22,48,92,0.10)" stroke="#16305c" stroke-width="2"/><text x="290" y="335" text-anchor="middle" class="d-lbl">Planet</text><path d="M60 160 C250 230, 390 250, 384 330 C378 410, 250 430, 60 500" fill="none" stroke="#16305c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 160 L140 190" fill="none" stroke="#e0a72e" stroke-width="3.5" marker-end="url(#arG)"/><path d="M150 466 L70 496" fill="none" stroke="#e0a72e" stroke-width="3.5" marker-end="url(#arG)"/><text x="150" y="180" class="d-lbl-gold">In: speed 10</text><text x="160" y="486" class="d-lbl-gold">Out: speed 10</text><text x="250" y="580" text-anchor="middle" class="d-txt">The same speed out as in:</text><text x="250" y="596" text-anchor="middle" class="d-txt">only the direction turns</text><text x="524" y="44" class="d-head">B · Seen from the Sun</text><circle cx="640.0" cy="420.0" r="40.0" fill="rgba(22,48,92,0.10)" stroke="#16305c" stroke-width="2"/><path d="M620 480 L772 480" fill="none" stroke="#16305c" stroke-width="3" marker-end="url(#arN)"/><text x="696" y="504" text-anchor="middle" class="d-lbl">The planet's own motion</text><path d="M664 384 L711 256" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arG)"/><path d="M711 256 L863 256" fill="none" stroke="#16305c" stroke-width="2.5" marker-end="url(#arN)"/><path d="M664 384 L863 256" fill="none" stroke="#e0a72e" stroke-width="4" marker-end="url(#arG)"/><text x="701" y="286" text-anchor="end" class="d-txt halo">Out, as the planet sees it</text><text x="787" y="244" text-anchor="middle" class="d-lbl">+ the planet's motion</text><text x="841" y="326" class="d-lbl-gold halo">= out, as the Sun sees it:</text><text x="841" y="342" class="d-lbl-gold halo">much faster</text><text x="524" y="590" class="d-txt">The planet slows by an amount far too small to measure.</text><text x="24" y="640" class="d-sm">Speeds for illustration only · not to scale</text>
        
</svg>
