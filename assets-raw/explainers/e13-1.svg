<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <text x="24" y="44" class="d-head">A · The same missile, before and after</text><rect x="230.0" y="300" width="40" height="300" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M230.0 570 L218.0 600 L230.0 600 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M270.0 570 L282.0 600 L270.0 600 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M230.0 300 Q250 240 270.0 300 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="630" text-anchor="middle" class="d-lbl">Redstone missile</text><text x="150" y="260" text-anchor="end" class="d-lbl">A warhead</text><path d="M156 256 L236 280" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="420" text-anchor="end" class="d-txt">Works most</text><text x="150" y="436" text-anchor="end" class="d-txt">of the time</text><rect x="620.0" y="260" width="40" height="340" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M620.0 570 L608.0 600 L620.0 600 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M660.0 570 L672.0 600 L660.0 600 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M620.0 260 L630.0 230 L650.0 230 L660.0 260 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M640 230 L640 204" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="640" cy="248" r="4" fill="#e0a72e"/><path d="M640 204 L640 140 M634 204 L646 204" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="635" y="118" width="10" height="24" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="640" y="630" text-anchor="middle" class="d-lbl">Mercury-Redstone</text><path d="M650 130 L720 126" fill="none" stroke="#e0a72e" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="728" y="130" class="d-lbl-gold">Escape tower</text><text x="728" y="146" class="d-txt">pulls the capsule clear</text><path d="M660 238 L720 216" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="728" y="220" class="d-lbl">A capsule for a person</text><text x="728" y="236" class="d-txt">instead of a warhead</text><path d="M660 300 L720 306" fill="none" stroke="#e0a72e" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="728" y="310" class="d-lbl-gold">Abort sensing</text><text x="728" y="326" class="d-txt">watches the rocket, fires the escape by itself</text><path d="M660 420 L720 396" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="728" y="400" class="d-lbl">Longer tanks</text><text x="728" y="416" class="d-txt">to burn longer with a heavier load</text><path d="M660 520 L720 486" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="728" y="490" class="d-lbl">Weak points strengthened</text><text x="728" y="506" class="d-txt">wider safety margins</text><path d="M660 580 L720 566" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="728" y="570" class="d-lbl">A safer fuel</text><text x="728" y="586" class="d-txt">alcohol, not Jupiter-C’s more toxic hydyne</text><text x="24" y="650" class="d-sm">Not to scale · the changes NASA made to the Army’s Redstone for Mercury, simplified</text>
        </svg>
