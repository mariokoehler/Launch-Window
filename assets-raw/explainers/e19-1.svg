oke="#e0a72e" stroke-width="1.5" marker-end="url(#arG)"/><path d="M712 390 L688 390" fill="none" stroke="#e0a72e" stroke-width="1.5" marker-end="url(#arG)"/><path d="M738 390 L762 390" fill="none" stroke="#e0a72e" stroke-width="1.5" marker-end="url(#arG)"/><path d="M725 180 L725 240" fill="none" stroke="#16305c" stroke-width="3" marker-end="url(#arN)"/><text x="725" y="452" text-anchor="middle" class="d-lbl">Sealed and full:</text><text x="725" y="468" text-anchor="middle" class="d-txt">hard to crush</text><path d="M880 420 L870 380 L890 350 L866 320 L884 290 L876 260 L966 260 L958 290 L974 320 L952 350 L970 380 L960 420 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M920 180 L920 248" fill="none" stroke="#16305c" stroke-width="3" marker-end="url(#arN)"/><text x="920" y="452" text-anchor="middle" class="d-lbl">Open and empty:</text><text x="920" y="468" text-anchor="middle" class="d-txt">crumples easily</text><text x="24" y="640" class="d-sm">Not to scale · the skin is drawn much thicker than it was</text>
