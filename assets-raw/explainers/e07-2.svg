<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M590 30 L590 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · An ablative shield, cut open</text><text x="70" y="86" class="d-lbl">Heat from the glowing air</text><path d="M100 96 L100 168" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><path d="M200 96 L200 168" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><path d="M300 96 L300 168" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><path d="M400 96 L400 168" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><rect x="70" y="176" width="350" height="40" fill="rgba(22,48,92,0.55)"/><path d="M70 176 L100 172 L130 178 L170 171 L210 177 L250 172 L290 178 L330 171 L370 177 L420 173" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="70" y="216" width="350" height="30" fill="url(#hatchG)" stroke="#e0a72e" stroke-width="1"/><rect x="70" y="246" width="350" height="100" fill="url(#hatch)" stroke="#16305c" stroke-width="1"/><rect x="70" y="346" width="350" height="18" fill="#16305c"/><rect x="70" y="364" width="350" height="60" fill="#ffffff" stroke="rgba(22,48,92,0.25)" stroke-width="1"/><path d="M150 172 L140 112" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M250 172 L245 112" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M350 172 L360 112" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="440" y="150" class="d-lbl-gold">Gases carry heat away</text><text x="440" y="200" class="d-lbl">Char layer</text><text x="440" y="216" class="d-txt">burns off slowly</text><text x="440" y="236" class="d-lbl-gold">Charring zone</text><text x="440" y="296" class="d-lbl">Shield, untouched</text><text x="440" y="312" class="d-txt">so far</text><text x="440" y="360" class="d-lbl">Capsule wall</text><text x="440" y="398" class="d-lbl">Inside stays cool</text><text x="440" y="414" class="d-txt">enough for the crew</text><text x="614" y="44" class="d-head">B · Vostok’s self-turning ball</text><circle cx="814" cy="348" r="132" fill="url(#hatch)" stroke="#16305c" stroke-width="1.5"/><circle cx="820" cy="340" r="115" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="884" cy="282" r="16" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="910" y="266" class="d-sm">Hatch</text><path d="M814 340 L826 340 M820 334 L820 346" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="800" cy="364" r="7" fill="#e0a72e" stroke="#16305c" stroke-width="1.5"/><path d="M806 368 L900 400" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="906" y="396" class="d-lbl">Weight set low:</text><text x="906" y="412" class="d-txt">the heavy side</text><text x="906" y="428" class="d-txt">swings forward</text><path d="M722 468 L664 526" fill="none" stroke="#16305c" stroke-width="2.5" marker-end="url(#arN)"/><text x="660" y="548" text-anchor="end" class="d-sm">Direction of travel</text><path d="M712 420 L700 440" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="626" y="580" class="d-txt">Coating all over, thickest on the heavy side</text><text x="24" y="640" class="d-sm">Layers not to scale · Vostok’s ball was about 2.3 m across</text>
        </svg>
