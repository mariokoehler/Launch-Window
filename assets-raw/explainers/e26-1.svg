<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M560 30 L560 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · Sunlight on one square metre</text><text x="130" y="130" text-anchor="end" class="d-lbl">Earth</text><text x="130" y="146" text-anchor="end" class="d-txt">1 × as far</text><rect x="150.0" y="104.0" width="80.0" height="80.0" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="3 4"/><rect x="150.0" y="104.0" width="80.0" height="80.0" fill="#e0a72e" stroke="#e0a72e" stroke-width="1"/><text x="250" y="150" class="d-lbl">100 %</text><text x="130" y="240" text-anchor="end" class="d-lbl">Mars</text><text x="130" y="256" text-anchor="end" class="d-txt">1.52 × as far</text><rect x="150.0" y="214.0" width="80.0" height="80.0" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="3 4"/><rect x="150.0" y="241.5" width="52.5" height="52.5" fill="#e0a72e" stroke="#e0a72e" stroke-width="1"/><text x="250" y="260" class="d-lbl">about 43 %</text><text x="130" y="350" text-anchor="end" class="d-lbl">Jupiter</text><text x="130" y="366" text-anchor="end" class="d-txt">5.2 × as far</text><rect x="150.0" y="324.0" width="80.0" height="80.0" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="3 4"/><rect x="150.0" y="388.6" width="15.4" height="15.4" fill="#e0a72e" stroke="#e0a72e" stroke-width="1"/><text x="250" y="370" class="d-lbl">about 3.7 %</text><text x="130" y="460" text-anchor="end" class="d-lbl">Saturn</text><text x="130" y="476" text-anchor="end" class="d-txt">9.55 × as far</text><rect x="150.0" y="434.0" width="80.0" height="80.0" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="3 4"/><rect x="150.0" y="505.6" width="8.4" height="8.4" fill="#e0a72e" stroke="#e0a72e" stroke-width="1"/><text x="250" y="480" class="d-lbl">about 1.1 %</text><text x="330" y="590" text-anchor="middle" class="d-lbl-gold">Twice as far, a quarter of the light</text><text x="584" y="44" class="d-head">B · Power from heat</text><rect x="760.0" y="220.0" width="80.0" height="220.0" fill="url(#hatchG)" stroke="#e0a72e" stroke-width="2"/><path d="M760 240 L710 230 M840 240 L890 230" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M760 276 L710 266 M840 276 L890 266" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M760 312 L710 302 M840 312 L890 302" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M760 348 L710 338 M840 348 L890 338" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M760 384 L710 374 M840 384 L890 374" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M760 420 L710 410 M840 420 L890 410" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="800" y="204" text-anchor="middle" class="d-lbl">Radioisotope generator</text><text x="904" y="280" class="d-txt">Inside: plutonium,</text><text x="904" y="296" class="d-txt">warm for decades</text><text x="904" y="344" class="d-txt">Fins shed the</text><text x="904" y="360" class="d-txt">heat it doesn't use</text><path d="M800 450 L800 500" fill="none" stroke="#e0a72e" stroke-width="2.5" marker-end="url(#arG)"/><text x="800" y="522" text-anchor="middle" class="d-lbl-gold">Electricity, day and night,</text><text x="800" y="538" text-anchor="middle" class="d-txt">with no moving parts</text><text x="24" y="640" class="d-sm">Squares to scale with the light they receive</text>
        
</svg>
