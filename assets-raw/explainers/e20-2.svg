<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M500 30 L500 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · What has to land, and lift off again</text><path d="M40 566 L450 566" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M100 526 L78 566 M180 526 L202 566" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="100.0" y="486.0" width="80.0" height="40.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="108.0" y="356.0" width="64.0" height="130.0" fill="url(#hatch)" stroke="#16305c" stroke-width="2"/><rect x="117.0" y="320.0" width="46.0" height="36.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="120.0" y="256.0" width="40.0" height="64.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M186 506 L204 506" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="210" y="510" class="d-txt">Legs and braking engine</text><path d="M186 421 L204 421" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="210" y="425" class="d-txt">Fuel to lift off and fly home</text><path d="M186 338 L204 338" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="210" y="342" class="d-txt">Return engine</text><path d="M186 288 L204 288" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="210" y="292" class="d-txt">Heat shield and capsule</text><text x="140" y="590" text-anchor="middle" class="d-lbl">Direct ascent</text><text x="140" y="606" text-anchor="middle" class="d-txt">the whole return ship lands</text><path d="M380.2 549.8 L369.4 566 M419.8 549.8 L430.6 566" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M364.0 566 L374.8 566 M425.2 566 L436.0 566" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="378.4" y="533.6" width="43.2" height="18.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M385.6 533.6 L385.6 517.4 L394.6 510.2 L410.8 510.2 L414.4 519.2 L414.4 533.6 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="400" y="590" text-anchor="middle" class="d-lbl-gold">Lunar-orbit rendezvous</text><text x="400" y="606" text-anchor="middle" class="d-txt">a light lander: two people,</text><text x="400" y="620" text-anchor="middle" class="d-txt">no heat shield</text><text x="40" y="110" class="d-body">Everything that lands needs fuel to brake on the</text><text x="40" y="130" class="d-body">way down, and more fuel to climb back up. So</text><text x="40" y="150" class="d-body">leave all you can in lunar orbit.</text><text x="24" y="640" class="d-sm">Sizes indicative, not to scale</text><text x="524" y="44" class="d-head">B · The Soviet plan, N1-L3</text><path d="M614 360 A156 156 0 1 0 926 360 A156 156 0 1 0 614 360" fill="none" stroke="#16305c" stroke-width="1.5" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="770.0" cy="360.0" r="90.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="743.0" cy="342.0" r="16.2" fill="none" stroke="#16305c" stroke-width="1"/><circle cx="792.5" cy="387.0" r="10.8" fill="none" stroke="#16305c" stroke-width="1"/><rect x="622.0" y="232.0" width="56.0" height="20.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="616" y="246" text-anchor="end" class="d-lbl halo">Orbiter (LOK):</text><text x="616" y="262" text-anchor="end" class="d-txt halo">one cosmonaut waits</text><path d="M810.1 285.7 L804.7 293.8 M829.9 285.7 L835.3 293.8" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M802.0 293.8 L807.4 293.8 M832.6 293.8 L838.0 293.8" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="809.2" y="277.6" width="21.6" height="9.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M812.8 277.6 L812.8 269.5 L817.3 265.90000000000003 L825.4 265.90000000000003 L827.2 270.40000000000003 L827.2 277.6 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="854" y="264" class="d-lbl-gold halo">LK lander,</text><text x="854" y="280" class="d-txt halo">one cosmonaut</text><path d="M680 246 Q760 212 800 280" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-dasharray="3 6" stroke-linejoin="round" stroke-linecap="round"/><text x="764" y="202" text-anchor="middle" class="d-lbl-gold halo">Crossed over by spacewalk</text><text x="524" y="596" class="d-txt">The rival design: Chelomey's UR-700 rocket would have</text><text x="524" y="612" class="d-txt">sent the LK-700 straight down and back (direct ascent).</text><text x="1036" y="640" text-anchor="end" class="d-sm">Not to scale</text>
        
</svg>
