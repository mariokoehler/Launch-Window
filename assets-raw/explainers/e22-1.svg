  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M520 30 L520 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · A balloon shaped like a person</text><circle cx="140.0" cy="140.0" r="20.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="140.0" cy="140.0" r="12.0" fill="rgba(22,48,92,0.08)" stroke="#16305c" stroke-width="1"/><rect x="112.0" y="164" width="56.0" height="92" rx="18.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="98.0" y="170" width="16.0" height="80" rx="8.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="118.0" y="258" width="20.0" height="96" rx="9.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="166.0" y="170" width="16.0" height="80" rx="8.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="142.0" y="258" width="20.0" height="96" rx="9.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="370.0" cy="140.0" r="21.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="370.0" cy="140.0" r="12.0" fill="rgba(22,48,92,0.08)" stroke="#16305c" stroke-width="1"/><rect x="335.0" y="164" width="70.0" height="92" rx="22.5" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="317.0" y="170" width="20.0" height="80" rx="10.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="342.5" y="258" width="25.0" height="96" rx="11.2" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="403.0" y="170" width="20.0" height="80" rx="10.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="372.5" y="258" width="25.0" height="96" rx="11.2" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="140" y="392" text-anchor="middle" class="d-lbl">On the ground</text><text x="370" y="392" text-anchor="middle" class="d-lbl">In vacuum, pressurised</text><path d="M392.0 179.4 L405.0 156.9" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M411.3 216.1 L435.8 207.2" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M411.3 263.9 L435.8 272.8" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M392.0 300.6 L405.0 323.1" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M328.7 263.9 L304.2 272.8" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M328.7 216.1 L304.2 207.2" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="370" y="420" text-anchor="middle" class="d-txt">about a third of an atmosphere inside,</text><text x="370" y="436" text-anchor="middle" class="d-txt">nothing outside: the suit swells</text><text x="40" y="500" class="d-body">Bending a stiff, swollen glove is like</text><text x="40" y="520" class="d-body">squeezing a balloon: every grip is work.</text><text x="544" y="44" class="d-head">B · Voskhod 2, 18 March 1965</text><circle cx="660.0" cy="300.0" r="80.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M660 380 L660 420 M590 420 L730 420" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="660" y="304" text-anchor="middle" class="d-lbl">Capsule</text><path d="M728 258 L870 180 L902 228 L752 306" fill="url(#hatchG)" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="800" y="170" text-anchor="end" class="d-lbl-gold">Inflatable airlock</text><path d="M900 200 Q920 160 930 150" fill="none" stroke="#16305c" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(918 64) scale(0.42)"><circle cx="60.0" cy="20.0" r="21.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="60.0" cy="20.0" r="12.0" fill="rgba(22,48,92,0.08)" stroke="#16305c" stroke-width="1"/><rect x="25.0" y="44" width="70.0" height="92" rx="22.5" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="7.0" y="50" width="20.0" height="80" rx="10.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="32.5" y="138" width="25.0" height="96" rx="11.2" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="93.0" y="50" width="20.0" height="80" rx="10.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><rect x="62.5" y="138" width="25.0" height="96" rx="11.2" fill="#ffffff" stroke="#16305c" stroke-width="2"/></g><text x="1000" y="60" text-anchor="end" class="d-lbl">Leonov</text><text x="560" y="490" class="d-txt">Outside, his suit swelled so much that he could not</text><text x="560" y="506" class="d-txt">get his feet back into the airlock. He let air out</text><text x="560" y="522" class="d-txt">of the suit, risking the bends, and went in head first.</text><text x="24" y="640" class="d-sm">Not to scale</text>
        
</svg>
