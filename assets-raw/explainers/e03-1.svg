<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  </style>
          <text x="24" y="44" class="d-head">The trip, priced in speed changes</text>
          <text x="24" y="64" class="d-txt">Each leg shows how much speed a rocket must gain or lose: engineers call it delta-v.</text>

          <!-- Earth and Moon -->
          <circle cx="90" cy="340" r="40" fill="rgba(22,48,92,0.07)" stroke="#16305c" stroke-width="2"/>
          <path d="M66 326 q14 -10 28 -2 q10 6 20 0 M64 352 q16 8 30 -2" fill="none" stroke="rgba(22,48,92,0.3)" stroke-width="1.5" stroke-linecap="round"/>
          <text x="90" y="400" text-anchor="middle" class="d-sm">Earth</text>
          <circle cx="985" cy="340" r="28" fill="#ffffff" stroke="#16305c" stroke-width="2"/>
          <circle cx="978" cy="332" r="5" fill="none" stroke="rgba(22,48,92,0.35)" stroke-width="1.2"/>
          <circle cx="992" cy="348" r="3.5" fill="none" stroke="rgba(22,48,92,0.35)" stroke-width="1.2"/>
          <text x="985" y="388" text-anchor="middle" class="d-sm">Moon</text>

          <!-- The route -->
          <path d="M110 304 Q150 230 240 230 L330 230" fill="none" stroke="#16305c" stroke-width="5" stroke-linecap="round"/>
          <path d="M330 230 L870 230 Q950 230 966 318" fill="none" stroke="#e0a72e" stroke-width="5" stroke-linecap="round"/>
          <path d="M966 362 Q950 450 870 450 L330 450" fill="none" stroke="#e0a72e" stroke-width="5" stroke-linecap="round"/>
          <path d="M330 450 L240 450 Q150 450 110 376" fill="none" stroke="#16305c" stroke-width="2" stroke-dasharray="6 5"/>
          <path d="M515 222 L529 230 L515 238 Z" fill="#16305c"/>
          <path d="M529 442 L515 450 L529 458 Z" fill="#16305c"/>

          <!-- Stops -->
          <g fill="#ffffff" stroke="#16305c" stroke-width="3">
            <circle cx="330" cy="230" r="9"/><circle cx="600" cy="230" r="9"/><circle cx="790" cy="230" r="9"/>
            <circle cx="790" cy="450" r="9"/><circle cx="600" cy="450" r="9"/><circle cx="330" cy="450" r="9"/>
          </g>
          <text x="330" y="206" text-anchor="middle" class="d-lbl">Low Earth orbit</text>
          <text x="600" y="206" text-anchor="middle" class="d-lbl">Heading for the Moon</text>
          <text x="790" y="206" text-anchor="middle" class="d-lbl">Lunar orbit</text>
          <text x="790" y="482" text-anchor="middle" class="d-lbl">Lunar orbit</text>
          <text x="600" y="482" text-anchor="middle" class="d-lbl">Heading home</text>
          <text x="330" y="482" text-anchor="middle" class="d-lbl">Into the air</text>

          <!-- Prices: outbound -->
          <text x="220" y="262" text-anchor="middle" class="d-lbl">9.4 km/s</text>
          <text x="220" y="278" text-anchor="middle" class="d-txt">Launch to orbit</text>
          <text x="465" y="262" text-anchor="middle" class="d-lbl-gold">3.1 km/s</text>
          <text x="465" y="278" text-anchor="middle" class="d-txt">Leave Earth orbit</text>
          <text x="695" y="262" text-anchor="middle" class="d-lbl-gold">0.9 km/s</text>
          <text x="695" y="278" text-anchor="middle" class="d-txt">Brake into lunar orbit</text>
          <text x="935" y="300" text-anchor="end" class="d-lbl-gold">2.0 km/s</text>
          <text x="935" y="316" text-anchor="end" class="d-txt">Land: no air to brake</text>
          <!-- Prices: home -->
          <text x="935" y="384" text-anchor="end" class="d-lbl-gold">1.9 km/s</text>
          <text x="935" y="400" text-anchor="end" class="d-txt">Climb back to orbit</text>
          <text x="695" y="416" text-anchor="middle" class="d-lbl-gold">1.0 km/s</text>
          <text x="695" y="432" text-anchor="middle" class="d-txt">Head for home</text>
          <text x="465" y="416" text-anchor="middle" class="d-lbl">Coast</text>
          <text x="465" y="432" text-anchor="middle" class="d-txt">a few small corrections</text>
          <text x="250" y="412" text-anchor="middle" class="d-lbl">0 km/s</text>
          <text x="250" y="428" text-anchor="middle" class="d-txt">The air brakes you</text>

          <!-- Inside the loop -->
          <text x="555" y="336" text-anchor="middle" class="d-lbl-gold" style="font-size: 22px;">After orbit: about 8.9 km/s more</text>
          <text x="555" y="358" text-anchor="middle" class="d-txt">almost as much again as getting to orbit</text>

          <!-- The two halves of the bill -->
          <text x="24" y="543" class="d-lbl">Earth to orbit</text>
          <rect x="230" y="530" width="517" height="18" fill="#16305c"/>
          <text x="757" y="543" class="d-lbl">9.4 km/s</text>
          <text x="24" y="579" class="d-lbl">Orbit to the Moon and back</text>
          <rect x="230" y="566" width="489.5" height="18" fill="#e0a72e" stroke="#16305c" stroke-width="1.5"/>
          <path d="M400.5 566 L400.5 584 M450 566 L450 584 M560 566 L560 584 M664.5 566 L664.5 584" stroke="#16305c" stroke-width="1.5"/>
          <g class="d-sm" text-anchor="middle" style="fill: #16305c;">
            <text x="315" y="579">3.1</text><text x="425" y="579">0.9</text><text x="505" y="579">2.0</text><text x="612" y="579">1.9</text><text x="692" y="579">1.0</text>
          </g>
          <text x="729.5" y="579" class="d-lbl-gold">8.9 km/s</text>

          <text x="24" y="640" class="d-sm">An Apollo-style trip · figures rounded · the trip home brakes in Earth’s air for free</text>
        </svg>
