<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M520 30 L520 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · Luna 16 on the Moon</text><path d="M40 560 L500 560" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="560" width="460" height="50" fill="url(#hatch)"/><path d="M160 510 L130 560 M300 510 L330 560" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="150.0" y="450.0" width="160.0" height="60.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="230" y="486" text-anchor="middle" class="d-txt">Landing stage</text><rect x="190.0" y="370.0" width="80.0" height="80.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="230" y="406" text-anchor="middle" class="d-txt">Ascent</text><text x="230" y="422" text-anchor="middle" class="d-txt">stage</text><circle cx="230.0" cy="346.0" r="22.0" fill="url(#hatchG)" stroke="#e0a72e" stroke-width="2"/><text x="264" y="334" class="d-lbl-gold halo">Return capsule</text><path d="M310 470 L390 350 L426 410" fill="none" stroke="#16305c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M426 410 L426 590" fill="none" stroke="#16305c" stroke-width="3" stroke-dasharray="2 0" stroke-linejoin="round" stroke-linecap="round"/><path d="M426 560 L426 596" fill="none" stroke="#e0a72e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="440" y="590" class="d-lbl">Drill, about 35 cm</text><path d="M380 330 Q320 270 260 320" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="340" y="270" text-anchor="middle" class="d-txt">The arm swings the core up</text><text x="340" y="286" text-anchor="middle" class="d-txt">into the capsule</text><text x="544" y="44" class="d-head">B · Straight home, no rendezvous</text><circle cx="640.0" cy="520.0" r="50.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="625.0" cy="510.0" r="9.0" fill="none" stroke="#16305c" stroke-width="1"/><circle cx="652.5" cy="535.0" r="6.0" fill="none" stroke="#16305c" stroke-width="1"/><circle cx="960.0" cy="140.0" r="50.0" fill="rgba(22,48,92,0.10)" stroke="#16305c" stroke-width="2"/><path d="M910 140 Q960 162.5 1010 140" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M660 470 C 700 300, 820 200, 912 156" fill="none" stroke="#e0a72e" stroke-width="3" marker-end="url(#arG)"/><text x="700" y="300" text-anchor="end" class="d-lbl">Ascent stage climbs</text><text x="700" y="316" text-anchor="end" class="d-txt">straight to Earth</text><path d="M960 190 L960 250" fill="none" stroke="#16305c" stroke-width="1" stroke-dasharray="3 3" stroke-linejoin="round" stroke-linecap="round"/><path d="M940 250 Q960 230 980 250 Z" fill="#ffffff" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M942 250 L960 266 L978 250" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="960.0" cy="270.0" r="6.0" fill="#e0a72e" stroke="#e0a72e" stroke-width="1"/><text x="944" y="274" text-anchor="end" class="d-lbl">Parachute,</text><text x="944" y="290" text-anchor="end" class="d-txt">Kazakhstan</text><text x="640" y="600" text-anchor="middle" class="d-sm">Moon</text><text x="960" y="72" text-anchor="middle" class="d-sm">Earth</text><text x="24" y="640" class="d-sm">Not to scale</text>
        
</svg>
