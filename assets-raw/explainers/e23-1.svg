          <text x="24" y="44" class="d-head">A · Earth to Mars, seen from above</text><circle cx="330.0" cy="330.0" r="133.0" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1.5" stroke-dasharray="3 5"/><circle cx="330.0" cy="330.0" r="184.0" fill="none" stroke="#16305c" stroke-width="1.5"/><circle cx="330.0" cy="330.0" r="280.4" fill="none" stroke="#16305c" stroke-width="1.5"/><text x="330" y="190.968" text-anchor="middle" class="d-sm halo">Venus's orbit</text><text x="330" y="140" text-anchor="middle" class="d-sm halo">Earth's orbit</text><text x="330" y="65.584" text-anchor="middle" class="d-sm halo">Mars's orbit</text><circle cx="330.0" cy="330.0" r="16.0" fill="#e0a72e" stroke="#e0a72e" stroke-width="1"/><path d="M351.0 330.0 L358.0 330.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M348.2 340.5 L354.2 344.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M340.5 348.2 L344.0 354.2" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M330.0 351.0 L330.0 358.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M319.5 348.2 L316.0 354.2" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M311.8 340.5 L305.8 344.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M309.0 330.0 L302.0 330.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M311.8 319.5 L305.8 316.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M319.5 311.8 L316.0 305.8" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M330.0 309.0 L330.0 302.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M340.5 311.8 L344.0 305.8" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M348.2 319.5 L354.2 316.0" fill="none" stroke="#e0a72e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="370" text-anchor="middle" class="d-sm">Sun</text><path d="M146.0 330.0 A232.2 227.1 0 0 0 610.4 330.0" fill="none" stroke="#e0a72e" stroke-width="3.5"/><path d="M348.2 557.6 L380.2 557.1" fill="none" stroke="#e0a72e" stroke-width="3" marker-end="url(#arG)"/><text x="418.208" y="543.149" text-anchor="middle" class="d-lbl-gold halo">The transfer: about 259 days</text><circle cx="146.0" cy="330.0" r="9.0" fill="rgba(22,48,92,0.25)" stroke="#16305c" stroke-width="2"/><text x="162" y="320" class="d-lbl halo">Earth at launch</text><text x="162" y="336" class="d-txt halo">one burn, then coast</text><circle cx="129.3" cy="525.8" r="7.0" fill="#ffffff" stroke="#16305c" stroke-width="2"/><text x="143.308" y="545.847" class="d-lbl halo">Mars at launch</text><circle cx="610.4" cy="330.0" r="7.0" fill="#16305c" stroke="#16305c" stroke-width="2"/><text x="624.416" y="334" class="d-lbl halo">Mars at arrival</text><circle cx="376.7" cy="152.0" r="7.0" fill="#ffffff" stroke="rgba(22,48,92,0.25)" stroke-width="2"/><text x="388.691" y="144.023" class="d-txt halo">Earth at arrival</text><path d="M330.0 330.0 L129.3 525.8" fill="none" stroke="#16305c" stroke-width="1" stroke-dasharray="2 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M260.0 330.0 A70 70 0 0 0 279.9 378.9" fill="none" stroke="#16305c" stroke-width="2"/><text x="234" y="370" text-anchor="middle" class="d-lbl halo">about 44°</text><text x="680" y="44" class="d-head">B · Days on the cheapest path</text><text x="680" y="91" class="d-lbl">To Venus</text><rect x="760.0" y="76.0" width="116.8" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><text x="884.8" y="91" class="d-txt">about 146</text><text x="680" y="131" class="d-lbl">To Mars</text><rect x="760.0" y="116.0" width="207.2" height="20.0" fill="#e0a72e" stroke="none" stroke-width="0"/><text x="975.2" y="131" class="d-txt">about 259</text><text x="680" y="210" class="d-head">C · Why this path</text><text x="680" y="240" class="d-body">Leave in the direction Earth is</text><text x="680" y="260" class="d-body">already moving, and borrow its</text><text x="680" y="280" class="d-body">speed round the Sun. One short</text><text x="680" y="300" class="d-body">burn, then months of coasting.</text><text x="24" y="640" class="d-sm">Orbits to scale, as circles · positions approximate</text>
        
