<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <text x="24" y="44" class="d-head">A · One flight, 11 steps</text><ellipse cx="75" cy="140" rx="50" ry="22" fill="none" stroke="#16305c" stroke-width="4"/><text x="75" y="104" text-anchor="middle" class="d-sm">1</text><ellipse cx="166" cy="140" rx="50" ry="8" fill="#16305c" stroke="#16305c" stroke-width="2"/><text x="166" y="104" text-anchor="middle" class="d-sm">2</text><ellipse cx="257" cy="140" rx="50" ry="22" fill="none" stroke="#16305c" stroke-width="4"/><text x="257" y="104" text-anchor="middle" class="d-sm">3</text><ellipse cx="348" cy="140" rx="50" ry="8" fill="#16305c" stroke="#16305c" stroke-width="2"/><text x="348" y="104" text-anchor="middle" class="d-sm">4</text><ellipse cx="439" cy="140" rx="50" ry="22" fill="none" stroke="#16305c" stroke-width="4"/><text x="439" y="104" text-anchor="middle" class="d-sm">5</text><ellipse cx="530" cy="140" rx="50" ry="8" fill="#16305c" stroke="#16305c" stroke-width="2"/><text x="530" y="104" text-anchor="middle" class="d-sm">6</text><ellipse cx="621" cy="140" rx="50" ry="22" fill="none" stroke="#16305c" stroke-width="4"/><text x="621" y="104" text-anchor="middle" class="d-sm">7</text><ellipse cx="712" cy="140" rx="50" ry="8" fill="#e0a72e" stroke="#e0a72e" stroke-width="2"/><text x="712" y="104" text-anchor="middle" class="d-sm">8</text><ellipse cx="803" cy="140" rx="50" ry="22" fill="none" stroke="#16305c" stroke-width="4"/><text x="803" y="104" text-anchor="middle" class="d-sm">9</text><ellipse cx="894" cy="140" rx="50" ry="8" fill="#16305c" stroke="#16305c" stroke-width="2"/><text x="894" y="104" text-anchor="middle" class="d-sm">10</text><ellipse cx="985" cy="140" rx="50" ry="22" fill="none" stroke="#16305c" stroke-width="4"/><text x="985" y="104" text-anchor="middle" class="d-sm">11</text><text x="712" y="196" text-anchor="middle" class="d-lbl-gold">One weak link breaks the chain</text><text x="24" y="236" class="d-txt">Vostok · Orbital flight: launch preparations, countdown, launch, ascent, deployment, orbital flight,</text><text x="24" y="252" class="d-txt">re-entry preparations, retrofire, modules separation, re-entry, descent and landing.</text><text x="24" y="310" class="d-head">B · Chance the whole flight succeeds</text><path d="M980 324 L980 590" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><text x="980" y="318" text-anchor="end" class="d-sm">Every time</text><text x="24" y="359" class="d-lbl">Each step 99.9 %</text><rect x="220" y="340" width="751.7" height="28" fill="#16305c"/><text x="961.682" y="359" text-anchor="end" class="d-lbl" style="fill: #ffffff;">about 99 %</text><text x="24" y="423" class="d-lbl">Each step 99 %</text><rect x="220" y="404" width="680.5" height="28" fill="#16305c"/><text x="890.457" y="423" text-anchor="end" class="d-lbl" style="fill: #ffffff;">about 90 %</text><text x="24" y="487" class="d-lbl">Each step 95 %</text><rect x="220" y="468" width="432.3" height="28" fill="#e0a72e"/><text x="642.288" y="487" text-anchor="end" class="d-lbl" style="fill: #16305c;">about 57 %</text><text x="24" y="551" class="d-lbl">Each step 90 %</text><rect x="220" y="532" width="238.5" height="28" fill="#16305c"/><text x="448.496" y="551" text-anchor="end" class="d-lbl" style="fill: #ffffff;">about 31 %</text><text x="24" y="640" class="d-sm">Whole-flight chance = the chance of one step, multiplied by itself 11 times</text>
        </svg>
