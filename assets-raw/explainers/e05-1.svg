<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  </style>
          <defs>
            <pattern id="fuel51" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.10)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern>
          </defs>
          <text x="24" y="44" class="d-head">Three ways to fill a rocket</text>
          <path d="M355 64 L355 600 M705 64 L705 600" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5"/>

          <!-- Column 1 · Kerosene and liquid oxygen (centre 180) -->
          <text x="180" y="84" text-anchor="middle" class="d-lbl">Kerosene + liquid oxygen</text>
          <text x="180" y="102" text-anchor="middle" class="d-txt">R-7, Atlas, Saturn V’s first stage</text>
          <path d="M165 150 L165 138" stroke="#16305c" stroke-width="2"/>
          <path d="M165 134 q-6 -6 0 -12 q6 -6 0 -12 M175 132 q-5 -5 0 -10 q5 -5 0 -10" fill="none" stroke="rgba(22,48,92,0.45)" stroke-width="1.5" stroke-linecap="round"/>
          <text x="40" y="132" class="d-txt">boils off</text>
          <text x="40" y="147" class="d-txt">through a vent</text>
          <rect x="140" y="150" width="80" height="170" rx="26" fill="url(#fuel51)" stroke="#16305c" stroke-width="2"/>
          <rect x="242" y="150" width="10" height="170" fill="#ffffff" stroke="#16305c" stroke-width="1.5"/>
          <rect x="242" y="276.4" width="10" height="43.6" fill="#16305c"/>
          <circle cx="247" cy="326" r="9" fill="#16305c"/>
          <text x="262" y="281" class="d-lbl">−183 °C</text>

          <text x="40" y="364" class="d-sm">Kept at</text>
          <text x="40" y="381" class="d-lbl">−183 °C, the oxygen</text>
          <text x="40" y="408" class="d-sm">Waits in the tank</text>
          <text x="40" y="425" class="d-lbl">Hours: the oxygen boils away</text>
          <text x="40" y="452" class="d-sm">Lights with</text>
          <text x="40" y="469" class="d-lbl">An igniter</text>
          <text x="40" y="496" class="d-sm">Hazards</text>
          <text x="40" y="513" class="d-lbl">Fire, frostbite</text>
          <text x="40" y="544" class="d-sm">Exhaust speed</text>
          <rect x="40" y="552" width="135" height="14" fill="#16305c"/>
          <text x="183" y="564" class="d-lbl">about 3.0 km/s</text>

          <!-- Column 2 · Liquid hydrogen and oxygen (centre 530) -->
          <text x="530" y="84" text-anchor="middle" class="d-lbl">Liquid hydrogen + oxygen</text>
          <text x="530" y="102" text-anchor="middle" class="d-txt">Saturn V’s upper stages</text>
          <path d="M515 150 L515 138" stroke="#16305c" stroke-width="2"/>
          <path d="M515 134 q-6 -6 0 -12 q6 -6 0 -12 M525 132 q-5 -5 0 -10 q5 -5 0 -10 M505 132 q-5 -5 0 -10 q5 -5 0 -10" fill="none" stroke="rgba(22,48,92,0.45)" stroke-width="1.5" stroke-linecap="round"/>
          <text x="390" y="132" class="d-txt">boils off</text>
          <text x="390" y="147" class="d-txt">fastest of all</text>
          <rect x="490" y="150" width="80" height="170" rx="26" fill="url(#fuel51)" stroke="#16305c" stroke-width="2"/>
          <rect x="592" y="150" width="10" height="170" fill="#ffffff" stroke="#16305c" stroke-width="1.5"/>
          <rect x="592" y="316" width="10" height="4" fill="#16305c"/>
          <circle cx="597" cy="326" r="9" fill="#16305c"/>
          <text x="612" y="316" class="d-lbl">−253 °C</text>

          <text x="390" y="364" class="d-sm">Kept at</text>
          <text x="390" y="381" class="d-lbl">−253 °C, the hydrogen</text>
          <text x="390" y="408" class="d-sm">Waits in the tank</text>
          <text x="390" y="425" class="d-lbl">Hours: it boils off fastest</text>
          <text x="390" y="452" class="d-sm">Lights with</text>
          <text x="390" y="469" class="d-lbl">An igniter</text>
          <text x="390" y="496" class="d-sm">Hazards</text>
          <text x="390" y="513" class="d-lbl">Fire, leaks, frostbite</text>
          <text x="390" y="544" class="d-sm">Exhaust speed</text>
          <rect x="390" y="552" width="189" height="14" fill="#16305c"/>
          <text x="587" y="564" class="d-lbl">about 4.2 km/s</text>

          <!-- Column 3 · A hypergolic pair (centre 880) -->
          <text x="880" y="84" text-anchor="middle" class="d-lbl-gold">A hypergolic pair</text>
          <text x="880" y="102" text-anchor="middle" class="d-txt">Titan II, Apollo’s spacecraft engines</text>
          <rect x="858" y="140" width="14" height="10" fill="#16305c"/>
          <text x="740" y="132" class="d-txt">sealed tight,</text>
          <text x="740" y="147" class="d-txt">nothing escapes</text>
          <rect x="840" y="150" width="80" height="170" rx="26" fill="url(#fuel51)" stroke="#16305c" stroke-width="2"/>
          <rect x="942" y="150" width="10" height="170" fill="#ffffff" stroke="#16305c" stroke-width="1.5"/>
          <rect x="942" y="161.3" width="10" height="158.7" fill="#e0a72e"/>
          <circle cx="947" cy="326" r="9" fill="#e0a72e" stroke="#16305c" stroke-width="1.5"/>
          <text x="962" y="166" class="d-lbl-gold">20 °C</text>

          <text x="740" y="364" class="d-sm">Kept at</text>
          <text x="740" y="381" class="d-lbl-gold">Room temperature</text>
          <text x="740" y="408" class="d-sm">Waits in the tank</text>
          <text x="740" y="425" class="d-lbl-gold">Months, even years</text>
          <text x="740" y="452" class="d-sm">Lights with</text>
          <text x="740" y="469" class="d-lbl-gold">Nothing: it lights on contact</text>
          <text x="740" y="496" class="d-sm">Hazards</text>
          <text x="740" y="513" class="d-lbl">Poisonous and corrosive</text>
          <text x="740" y="544" class="d-sm">Exhaust speed</text>
          <rect x="740" y="552" width="139.5" height="14" fill="#16305c"/>
          <text x="887" y="564" class="d-lbl">about 3.1 km/s</text>

          <text x="24" y="640" class="d-sm">Typical pairs of the 1960s · tanks drawn alike, temperatures to scale · a faster exhaust means more push per kilogram</text>
        </svg>
