<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M530 30 L530 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · The corridor</text><path d="M40 560 Q270 520 500 560 L500 600 L40 600 Z" fill="rgba(22,48,92,0.08)"/><path d="M40 560 Q270 520 500 560" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="496" y="590" text-anchor="end" class="d-sm">Earth's air</text><path d="M70 120 Q120 300 170 556" fill="none" stroke="#16305c" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/><text x="148" y="482" text-anchor="end" class="d-lbl">Too steep:</text><text x="148" y="498" text-anchor="end" class="d-txt">crushing braking,</text><text x="148" y="514" text-anchor="end" class="d-txt">too hot</text><path d="M70 120 C250 470, 420 520, 490 300" fill="none" stroke="#16305c" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/><text x="490" y="270" text-anchor="end" class="d-lbl">Too shallow:</text><text x="490" y="286" text-anchor="end" class="d-txt">skims back out to space</text><path d="M70 120 Q175 370 300 540" fill="none" stroke="#e0a72e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="290" y="494" class="d-lbl-gold halo">Just right: a few</text><text x="290" y="510" class="d-lbl-gold halo">degrees wide</text><circle cx="70.0" cy="120.0" r="6.0" fill="#16305c" stroke="#16305c" stroke-width="1"/><text x="84" y="116" class="d-lbl">Back from the Moon</text><text x="24" y="640" class="d-sm">Not to scale</text><text x="554" y="44" class="d-head">B · Skipping like a stone</text><path d="M560 520 L1040 520 L1040 600 L560 600 Z" fill="rgba(22,48,92,0.08)"/><path d="M560 520 L1040 520" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="570" y="540" class="d-sm">Top of the air</text><path d="M580 140 Q680 560 760 520 Q820 260 900 300 Q960 330 1000 560" fill="none" stroke="#e0a72e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="700" y="580" text-anchor="middle" class="d-lbl">1 · First dip:</text><text x="700" y="596" text-anchor="middle" class="d-txt">sheds some speed</text><text x="830" y="250" text-anchor="middle" class="d-lbl">2 · Back out,</text><text x="830" y="266" text-anchor="middle" class="d-txt">cooling off</text><text x="1000" y="580" text-anchor="end" class="d-lbl">3 · In again,</text><text x="1000" y="596" text-anchor="end" class="d-txt">more gently</text><text x="600" y="120" class="d-lbl-gold">Zond 7, August 1969</text>
        
</svg>
