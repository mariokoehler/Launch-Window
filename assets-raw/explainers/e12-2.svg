<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M560 30 L560 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · Heights, on a stretched scale</text><rect x="200" y="120.0" width="40" height="440.0" fill="#ffffff" stroke="#16305c" stroke-width="1.5"/><path d="M190 560.0 L200 560.0" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="184" y="564" text-anchor="end" class="d-sm">100 km</text><path d="M190 401.6 L200 401.6" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="184" y="405.621" text-anchor="end" class="d-sm">1,000 km</text><path d="M190 243.2 L200 243.2" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="184" y="247.243" text-anchor="end" class="d-sm">10,000 km</text><path d="M190 120.0 L200 120.0" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="184" y="124" text-anchor="end" class="d-sm">60,000 km</text><rect x="200" y="477.9" width="40" height="54.2" fill="#16305c"/><rect x="200" y="234.7" width="40" height="166.9" fill="url(#hatchG)" stroke="#e0a72e" stroke-width="1"/><rect x="200" y="120.0" width="40" height="105.2" fill="url(#hatchG)" stroke="#e0a72e" stroke-width="1"/><text x="256" y="500.995" class="d-lbl">Vostok and Mercury</text><text x="256" y="516.995" class="d-txt">about 150 to 330 km</text><text x="256" y="296.379" class="d-lbl-gold">Inner belt</text><text x="256" y="312.379" class="d-txt">about 1,000 to 12,000 km</text><text x="256" y="168.598" class="d-lbl-gold">Outer belt</text><text x="256" y="184.598" class="d-txt">about 13,000 km and up</text><path d="M196 337.2 L244 337.2" fill="none" stroke="#16305c" stroke-width="2.5" stroke-dasharray="5 3" stroke-linejoin="round" stroke-linecap="round"/><text x="256" y="341.234" class="d-txt">Explorer 1’s highest point, 2,550 km</text><text x="584" y="44" class="d-head">B · What a particle can do</text><rect x="680" y="150" width="180" height="120" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M690 150 L690 136 M690 270 L690 284" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M720 150 L720 136 M720 270 L720 284" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M750 150 L750 136 M750 270 L750 284" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M780 150 L780 136 M780 270 L780 284" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M810 150 L810 136 M810 270 L810 284" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M840 150 L840 136 M840 270 L840 284" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="770" y="205" text-anchor="middle" class="d-sm">Memory chip</text><text x="746" y="236" text-anchor="middle" class="d-lbl">0</text><path d="M760 232 L784 232" fill="none" stroke="#16305c" stroke-width="1.5" marker-end="url(#arN)"/><text x="800" y="236" text-anchor="middle" class="d-lbl-gold">1</text><path d="M600 100 L790 228" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="890" y="180" class="d-lbl">One particle can flip</text><text x="890" y="196" class="d-txt">a stored bit</text><rect x="660" y="390" width="16" height="140" fill="url(#hatch)" stroke="#16305c" stroke-width="1.5"/><path d="M590 410 L652 418" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M590 450 L652 458" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M590 490 L652 498" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><path d="M590 520 L800 560" fill="none" stroke="#e0a72e" stroke-width="2" marker-end="url(#arG)"/><text x="700" y="430" class="d-lbl">Shielding stops most,</text><text x="700" y="446" class="d-txt">not all</text><text x="810" y="566" class="d-txt">the rest add up</text><text x="810" y="582" class="d-txt">over the hours</text><text x="24" y="640" class="d-sm">Heights on a logarithmic scale: each step up is ten times higher</text>
