<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <text x="24" y="44" class="d-head">A · Earth laps Mars</text><circle cx="180.0" cy="210.0" r="10.0" fill="#e0a72e" stroke="#e0a72e" stroke-width="1"/><circle cx="180.0" cy="210.0" r="60.0" fill="none" stroke="#16305c" stroke-width="1.5"/><circle cx="180.0" cy="210.0" r="104.0" fill="none" stroke="#16305c" stroke-width="1.5"/><circle cx="120.0" cy="210.0" r="7" fill="#16305c"/><circle cx="105.0" cy="138.0" r="6" fill="#e0a72e"/><text x="96" y="236" text-anchor="middle" class="d-lbl halo">Earth</text><text x="78" y="124" text-anchor="middle" class="d-lbl-gold">Mars</text><path d="M160 292 A84 84 0 0 0 256 236" fill="none" stroke="#16305c" stroke-width="1.5" marker-end="url(#arN)"/><text x="310" y="150" class="d-body">The inside lane is shorter and faster.</text><text x="310" y="172" class="d-body">The same line-up comes round about</text><text x="310" y="194" class="d-body">every 26 months for Mars,</text><text x="310" y="216" class="d-body">every 19 months for Venus.</text><path d="M660 30 L660 330" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="684" y="44" class="d-head">Missed it?</text><text x="684" y="90" class="d-body">Outside the window the same</text><text x="684" y="112" class="d-body">trip needs far more fuel than</text><text x="684" y="134" class="d-body">a rocket can carry. You wait</text><text x="684" y="156" class="d-body">for the next window.</text><text x="24" y="360" class="d-head">B · The windows, 1960 to 1975</text><text x="60" y="434" text-anchor="end" class="d-lbl">Venus</text><text x="60" y="524" text-anchor="end" class="d-lbl">Mars</text><path d="M70 430 L1030 430" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 520 L1030 520" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="131.0" y="420.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="221.0" y="420.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="321.8" y="420.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="417.2" y="420.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="512.0" y="420.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="606.2" y="420.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="702.8" y="420.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="799.4" y="420.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="896.0" y="420.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="992.0" y="420.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="111.8" y="510.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="236.0" y="510.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="359.0" y="510.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="485.0" y="510.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="614.0" y="510.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="747.8" y="510.0" width="10.0" height="20.0" fill="#e0a72e" stroke="none" stroke-width="0"/><rect x="878.0" y="510.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><rect x="1004.0" y="510.0" width="10.0" height="20.0" fill="#16305c" stroke="none" stroke-width="0"/><path d="M70 580 L1030 580" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 580 L70 586" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="602" text-anchor="middle" class="d-sm">1960</text><path d="M190 580 L190 586" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="190" y="602" text-anchor="middle" class="d-sm">1962</text><path d="M310 580 L310 586" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="602" text-anchor="middle" class="d-sm">1964</text><path d="M430 580 L430 586" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="430" y="602" text-anchor="middle" class="d-sm">1966</text><path d="M550 580 L550 586" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="550" y="602" text-anchor="middle" class="d-sm">1968</text><path d="M670 580 L670 586" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="670" y="602" text-anchor="middle" class="d-sm">1970</text><path d="M790 580 L790 586" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="790" y="602" text-anchor="middle" class="d-sm">1972</text><path d="M910 580 L910 586" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="910" y="602" text-anchor="middle" class="d-sm">1974</text><path d="M1030 580 L1030 586" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="1030" y="602" text-anchor="middle" class="d-sm">1976</text><text x="226" y="412" text-anchor="middle" class="d-txt">Mariner 2</text><text x="707.8" y="412" text-anchor="middle" class="d-txt">Venera 7</text><text x="901" y="412" text-anchor="middle" class="d-txt">Mariner 10</text><text x="364" y="502" text-anchor="middle" class="d-txt">Mariner 4</text><text x="1009" y="502" text-anchor="middle" class="d-txt">Vikings</text><text x="752.8" y="550" text-anchor="middle" class="d-lbl-gold">May 1971: five craft</text><path d="M364.00000000000546 536 L364.00000000000546 544 L490.0 544 L490.0 536" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="427" y="560" text-anchor="middle" class="d-txt">about 26 months</text><path d="M422.19999999999345 446 L422.19999999999345 454 L517.0000000000027 454 L517.0000000000027 446" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="469.6" y="470" text-anchor="middle" class="d-txt">about 19 months</text><text x="24" y="640" class="d-sm">Each mark: one window, to the month</text>
        
</svg>
