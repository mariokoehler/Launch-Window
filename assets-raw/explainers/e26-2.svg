<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <text x="24" y="44" class="d-head">A · Three big dishes around the world</text><circle cx="240.0" cy="350.0" r="130.0" fill="rgba(22,48,92,0.10)" stroke="#16305c" stroke-width="2"/><path d="M110 350 Q240 408.5 370 350" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M240.0 220.0 L290.0 130.0 M240.0 220.0 L190.0 130.0" fill="none" stroke="#e0a72e" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="240.0" cy="220.0" r="7" fill="#16305c"/><text x="240" y="194" text-anchor="middle" class="d-lbl halo">California</text><path d="M127.4 415.0 L24.5 416.7 M127.4 415.0 L74.5 503.3" fill="none" stroke="#e0a72e" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="127.4" cy="415.0" r="7" fill="#16305c"/><text x="48.3641" y="448" text-anchor="middle" class="d-lbl halo">Spain</text><path d="M352.6 415.0 L405.5 503.3 M352.6 415.0 L455.5 416.7" fill="none" stroke="#e0a72e" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="352.6" cy="415.0" r="7" fill="#16305c"/><text x="431.636" y="448" text-anchor="middle" class="d-lbl halo">Australia</text><text x="240" y="310" text-anchor="middle" class="d-txt">About 120° apart:</text><text x="240" y="326" text-anchor="middle" class="d-txt">one always faces the probe</text><path d="M500 30 L500 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="524" y="44" class="d-head">B · How long a radio signal takes, one way</text><text x="620" y="126" text-anchor="end" class="d-lbl">Moon</text><rect x="636.0" y="110.0" width="73.4" height="22.0" fill="#16305c" stroke="none" stroke-width="0"/><text x="636" y="154" class="d-txt">about 1.3 seconds</text><text x="620" y="216" text-anchor="end" class="d-lbl">Mars</text><rect x="636.0" y="200.0" width="300.9" height="22.0" fill="#e0a72e" stroke="none" stroke-width="0"/><text x="636" y="244" class="d-txt">about 3 to 22 minutes</text><text x="620" y="306" text-anchor="end" class="d-lbl">Jupiter</text><rect x="636.0" y="290.0" width="390.0" height="22.0" fill="#e0a72e" stroke="none" stroke-width="0"/><text x="636" y="334" class="d-txt">about 33 to 53 minutes</text><text x="524" y="420" class="d-body">Lunokhod 1 was driven from Earth. Its crew</text><text x="524" y="442" class="d-body">watched slow TV pictures, and each order</text><text x="524" y="464" class="d-body">reached the rover a few seconds after it</text><text x="524" y="486" class="d-body">was given.</text><text x="24" y="640" class="d-sm">Not to scale · the bars are squeezed: Mars is hundreds of times farther than the Moon</text>
        
</svg>
