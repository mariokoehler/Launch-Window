<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M620 30 L620 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · Gravity at orbit height</text><text x="24" y="70" class="d-txt">Arrows to scale with each other: 300 km up,</text><text x="24" y="86" class="d-txt">gravity is still about 91 % of its pull at the ground.</text><circle cx="300" cy="380" r="180" fill="rgba(22,48,92,0.07)" stroke="#16305c" stroke-width="2"/><text x="300" y="384" text-anchor="middle" class="d-sm">Earth</text><circle cx="300" cy="380" r="225" fill="none" stroke="#e0a72e" stroke-width="2.5"/><circle cx="184.3" cy="242.1" r="5" fill="#16305c"/><path d="M184.3 242.1 L222.9 288.1" fill="none" stroke="#16305c" stroke-width="3" marker-end="url(#arN)"/><text x="172" y="228" text-anchor="end" class="d-lbl">On the ground</text><text x="172" y="244" text-anchor="end" class="d-txt">gravity 1 g</text><path d="M429.1 195.7 L397.7 240.5" fill="none" stroke="#16305c" stroke-width="3" marker-end="url(#arN)"/><path d="M429.1 195.7 L471.7 225.5" fill="none" stroke="#e0a72e" stroke-width="2.5" marker-end="url(#arG)"/><circle cx="429.1" cy="195.7" r="14" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="427.1" cy="189.7" r="2.6" fill="#16305c"/><path d="M427.1 192.7 L430.1 200.7 M423.1 195.7 L433.1 193.7" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="168" class="d-lbl-gold">300 km up</text><text x="450" y="184" class="d-txt">gravity still about 0.9 g</text><text x="476" y="244" class="d-txt">and sideways at 7.8 km/s:</text><text x="476" y="260" class="d-txt">it keeps missing the Earth</text><text x="644" y="44" class="d-head">B · A falling lift</text><rect x="760" y="92" width="160" height="488" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M840 92 L840 150 M840 172 L840 240" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M832 150 L848 156 L832 162 L848 168 L840 172" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="850" y="140" class="d-sm">cable cut</text><rect x="780" y="240" width="120" height="160" fill="#ffffff" stroke="#16305c" stroke-width="2"/><circle cx="840" cy="282" r="10" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M840 292 L840 330 M840 304 L818 294 M840 304 L862 292 M840 330 L828 356 M840 330 L854 358" fill="none" stroke="#16305c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M780 398 L900 398" fill="none" stroke="#16305c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M745 250 L745 340" fill="none" stroke="#16305c" stroke-width="2.5" marker-end="url(#arN)"/><text x="735" y="292" text-anchor="end" class="d-lbl">Lift</text><text x="735" y="308" text-anchor="end" class="d-txt">falls</text><path d="M884 270 L884 340" fill="none" stroke="#e0a72e" stroke-width="2.5" marker-end="url(#arG)"/><text x="912" y="296" class="d-lbl-gold">You fall</text><text x="912" y="312" class="d-txt">just as fast</text><text x="840" y="600" text-anchor="middle" class="d-txt">Floor and feet fall together:</text><text x="840" y="616" text-anchor="middle" class="d-txt">nothing presses, so you float.</text><text x="24" y="640" class="d-sm">Heights exaggerated · gravity arrows to scale with each other</text>
        </svg>
