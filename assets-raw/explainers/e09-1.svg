<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <path d="M530 30 L530 600" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="44" class="d-head">A · Mercury: an escape tower</text><rect x="210" y="436" width="80" height="170" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M210 436 L224 424 L238 438 L252 422 L266 436 L280 424 L290 436" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M236 420 L226 396" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M256 416 L258 390" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M276 420 L290 398" fill="none" stroke="#e0a72e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="196" y="520" text-anchor="end" class="d-lbl">The rocket</text><text x="196" y="536" text-anchor="end" class="d-txt">below fails</text><path d="M212 340 L288 340 L272 270 L228 270 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="238" y="250" width="24" height="20" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M240 250 L246 160 M260 250 L254 160 M240 250 L256 226 L242 204 L255 182 L246 160" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="244" y="112" width="12" height="48" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M244 112 L250 96 L256 112 Z" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M246 160 L224 200 L238 200 Z M254 160 L276 200 L262 200 Z" fill="rgba(224,167,46,0.35)" stroke="#e0a72e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M330 330 L330 220" fill="none" stroke="#16305c" stroke-width="3" marker-end="url(#arN)"/><text x="344" y="270" class="d-lbl">Pulled up</text><text x="344" y="286" class="d-txt">and away</text><path d="M244 130 L150 120" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="144" y="118" text-anchor="end" class="d-lbl">Escape tower:</text><text x="144" y="134" text-anchor="end" class="d-txt">a small solid rocket</text><text x="150" y="312" text-anchor="end" class="d-lbl">Capsule</text><text x="554" y="44" class="d-head">B · Vostok: an ejection seat</text><path d="M640 540 L640 350 Q720 240 800 350 L800 540" fill="none" stroke="rgba(22,48,92,0.25)" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/><text x="720" y="566" text-anchor="middle" class="d-sm">Inside the rocket’s nose fairing</text><circle cx="720" cy="420" r="70" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M752 358 A70 70 0 0 1 782 388" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 358 L760 346 M782 388 L794 380" fill="none" stroke="#16305c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M776 366 L890 226" fill="none" stroke="#16305c" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M884 206 L900 222 L926 196" fill="none" stroke="#16305c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="904" cy="192" r="7" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M888 226 L870 252 L882 252 Z" fill="rgba(224,167,46,0.4)" stroke="#e0a72e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="930" y="230" class="d-lbl">Seat fires out</text><text x="930" y="246" class="d-txt">through the hatch</text><path d="M930 420 Q965 380 1000 420" fill="none" stroke="#16305c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M930 420 L965 470 M1000 420 L965 470 M965 420 L965 470" fill="none" stroke="#16305c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="965" cy="476" r="5" fill="#16305c"/><text x="965" y="506" text-anchor="middle" class="d-txt">Later, the same way:</text><text x="965" y="522" text-anchor="middle" class="d-txt">down under his own</text><text x="965" y="538" text-anchor="middle" class="d-txt">parachute</text><text x="24" y="640" class="d-sm">Not to scale</text>
        </svg>
