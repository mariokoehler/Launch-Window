<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
  .d-head { font-family: Archivo; font-weight: 700; font-size: 13px; letter-spacing: 0.8px; fill: #16305c; text-transform: uppercase; }
  .d-lbl { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #16305c; }
  .d-lbl-gold { font-family: Archivo; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; fill: #8a5d12; }
  .d-txt { font-family: 'Work Sans'; font-weight: 500; font-size: 12.5px; fill: #5b5548; }
  .d-body { font-family: 'Work Sans'; font-weight: 500; font-size: 14px; fill: #1c1c1a; }
  .d-sm { font-family: Archivo; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; fill: #5b5548; text-transform: uppercase; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>

          <defs><marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16305c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0a72e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(22,48,92,0.08)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(22,48,92,0.35)" stroke-width="2"/></pattern><pattern id="hatchG" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(224,167,46,0.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(224,167,46,0.75)" stroke-width="2"/></pattern></defs>
          <text x="24" y="44" class="d-head">A · One station, one pass</text><circle cx="360" cy="420" r="270" fill="none" stroke="#16305c" stroke-width="1.5" stroke-dasharray="6 6"/><circle cx="360" cy="420" r="210" fill="rgba(22,48,92,0.07)" stroke="#16305c" stroke-width="2"/><path d="M190.3 210 A270 270 0 0 1 529.7 210" fill="none" stroke="#e0a72e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M90 210 L640 210" fill="none" stroke="#16305c" stroke-width="1.5" stroke-dasharray="3 4" stroke-linejoin="round" stroke-linecap="round"/><text x="646" y="214" class="d-sm">Station’s horizon</text><path d="M360 206 L225.0 186.2" fill="none" stroke="#e0a72e" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><rect x="218.0" y="179.2" width="14" height="14" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M360 206 L360.0 150.0" fill="none" stroke="#e0a72e" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><rect x="353.0" y="143.0" width="14" height="14" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M360 206 L495.0 186.2" fill="none" stroke="#e0a72e" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><rect x="488.0" y="179.2" width="14" height="14" fill="#ffffff" stroke="#16305c" stroke-width="2"/><path d="M360 214 L602.7 301.6" fill="none" stroke="#16305c" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M473.3 249.8 L489.3 265.8 M489.3 249.8 L473.3 265.8" fill="none" stroke="#16305c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="595.7" y="294.6" width="14" height="14" fill="#ffffff" stroke="#16305c" stroke-width="2" stroke-dasharray="3 2"/><text x="618.674" y="305.64" class="d-lbl">Below the horizon:</text><text x="618.674" y="321.64" class="d-txt">the Earth is in the way</text><path d="M350 210 Q360 190 370 210" fill="none" stroke="#16305c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M360 204 L360 214" fill="none" stroke="#16305c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="244" text-anchor="middle" class="d-lbl">Ground station</text><text x="360" y="128" text-anchor="middle" class="d-lbl-gold">In sight: a few minutes</text><path d="M100 300 A280 280 0 0 1 150 200" fill="none" stroke="#16305c" stroke-width="2" marker-end="url(#arN)"/><text x="70" y="322" class="d-sm">Direction</text><text x="70" y="336" class="d-sm">of flight</text><text x="720" y="452" class="d-sm">One lap, about 200 km up</text><rect x="720" y="464" width="300" height="22" fill="#ffffff" stroke="#16305c" stroke-width="1.5"/><rect x="720" y="464" width="23.9" height="22" fill="#e0a72e"/><text x="720" y="508" class="d-lbl-gold">In touch with one station:</text><text x="720" y="524" class="d-txt">at most about 7 minutes</text><text x="720" y="552" class="d-lbl">Out of reach:</text><text x="720" y="568" class="d-txt">the other 80 minutes</text><text x="24" y="640" class="d-sm">Heights exaggerated, so the arc in sight looks longer than it really is</text>
        </svg>
